  document.querySelectorAll("#main [data-open-class]").forEach(el=>el.addEventListener("click",()=>classSheet(el.dataset.openClass)));
  on("#add-class","click",()=>classSheet());
  document.querySelectorAll("#main [data-open-uni]").forEach(el=>el.addEventListener("click",()=>uniSheet(el.dataset.openUni)));
  document.querySelectorAll("#main [data-open-app]").forEach(el=>el.addEventListener("click",()=>appSheet(el.dataset.openApp)));
  on("#save-lists","click",async()=>{
    const split=id=>[...new Set(val(id).split("\n").map(x=>x.trim()).filter(Boolean))];
    const data={curators:split("l-cur"),updatedAt:new Date().toISOString()};
    if(!S.db)return toast("Нет связи с хранилищем");
    try{await S.db.doc("settings/lists").set(data);toast("Списки сохранены");reload("settings")}catch(e){fail(e)}
  });
}
document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{S.tab=b.dataset.tab;try{localStorage.setItem("gg-tab",S.tab)}catch(e){}render()}));

/* ---------- Supabase ---------- */
const TABLES={students:"tracker_students",unis:"tracker_universities",apps:"tracker_applications",tests:"tracker_tests",tasks:"tracker_tasks",meetings:"tracker_meetings",classes:"tracker_classes",members:"tracker_class_members"};
/* подробные поля вуза (миграция 007): [столбец, тип, подпись, раздел, варианты/подсказка] — по этому списку строятся карточка, сохранение и COLS */
const YNU=["Да","Нет","Неизвестно"];
const UNI_EXTRA=[
  // основное — видно сразу
  ["intl_portal","text","Портал подачи для иностранцев","main","https://…"],
  ["partner","text","Партнёр GetGrant (видят только кураторы)","main","★ Через Navitas · Прямой договор · Не продвигаем…"],
  ["tuition_usd_min","int","Обучение в год, $ (от)","main"],["tuition_usd_max","int","Обучение в год, $ (до)","main"],
  ["ielts_min","dec","Мин. IELTS","main"],["entrance_exam","text","Вступительный экзамен","main","CSCA, свой экзамен, интервью…"],
  // «Подробнее»
  ["majors","area","Направления на английском","Программы и требования"],
  ["toefl_min","int","Мин. TOEFL iBT","Программы и требования"],["duolingo_min","int","Мин. Duolingo","Программы и требования"],
  ["sat_policy","list","SAT / ACT","Программы и требования",["Обязателен","По желанию","Не рассматривается","Неизвестно"]],["sat_range","text","Средний SAT","Программы и требования","1450–1550"],
  ["coa_usd","int","Полная стоимость года, $","Деньги","обучение + жильё + жизнь"],["app_fee_usd","int","Сбор за подачу, $","Деньги"],
  ["merit","list","Мерит-стипендии","Деньги",YNU],["full_ride","list","Полная стипендия (full-ride)","Деньги",YNU],
  ["aid_policy","list","Помощь иностранцам","Деньги",["Need-blind","Need-aware","Нет need-based помощи","Неизвестно"]],["meets_need","list","Покрывает 100% потребности","Деньги",YNU],
  ["costs_note","area","Расходы в валюте вуза","Деньги","как на сайте: тариф, общежитие, страховка…"],
  ["platform","list","Платформа подачи","Подача",["Common App","UCAS","Coalition","Свой портал","Другое"]],["aid_deadline","date","Дедлайн фин. помощи / стипендии","Подача"],
  ["recs","int","Рекомендаций","Подача"],["supp_essays","int","Доп. эссе","Подача"],["interview","list","Интервью","Подача",["Обязательно","По желанию","Нет","Неизвестно"]],
  ["fee_waiver","list","Fee waiver","Подача",YNU],["css_profile","list","Нужен CSS Profile","Подача",YNU],
  ["community_notes","area","Полезное от студентов","От студентов","гранты, требования, советы — видят все студенты"],
  ["verified_intake","list","Данные проверены для набора","Актуальность",["2026","2027","2028"]],["verified_at","date","Дата проверки","Актуальность"],["source","area","Источник","Актуальность","ссылки; «от поступивших студентов»"],
];
const UNI_NULL=new Set(UNI_EXTRA.filter(x=>["int","dec","date"].includes(x[1])).map(x=>x[0]));
const camel=c=>c.replace(/_([a-z])/g,(_,l)=>l.toUpperCase());
const FIELD={communityNotes:"community_notes",createdByStudent:"created_by_student",lastStudentEditAt:"last_student_edit_at",studentEditsReviewedAt:"student_edits_reviewed_at",intlPortal:"intl_portal",studentNote:"student_note",addedBy:"added_by",uniType:"uni_type",tuitionUsdMin:"tuition_usd_min",tuitionUsdMax:"tuition_usd_max",coaUsd:"coa_usd",appFeeUsd:"app_fee_usd",costsNote:"costs_note",aidPolicy:"aid_policy",meetsNeed:"meets_need",fullRide:"full_ride",ieltsMin:"ielts_min",toeflMin:"toefl_min",duolingoMin:"duolingo_min",satPolicy:"sat_policy",entranceExam:"entrance_exam",admitRate:"admit_rate",admitRateIntl:"admit_rate_intl",feeWaiver:"fee_waiver",cssProfile:"css_profile",suppEssays:"supp_essays",aidDeadline:"aid_deadline",verifiedIntake:"verified_intake",verifiedAt:"verified_at",timeStart:"time_start",timeEnd:"time_end",classId:"class_id",studentEmail:"student_email",satRange:"sat_range",reportOpts:"report_opts",groupNotes:"group_notes",doneList:"done_list",curatorNotes:"curator_notes",unisNote:"unis_note",tierTitles:"tier_titles",deadlineText:"deadline_text",nextSteps:"next_steps",gradYear:"grad_year",studentId:"student_id",uniId:"uni_id",deadlineOverride:"deadline_override",createdAt:"created_at",updatedAt:"updated_at"};
const COLS={
  students:["name","student_email","checklist","report_opts","group_notes","metrics","targets","tier_titles","strategy","done_list","strengths","weaknesses","curator_notes","unis_note","grade","intake","type","track","school","status","curator","grad_year","major","countries","ielts","toefl","sat","ort","gpa","contact","parent","notes","created_at","updated_at"],
  unis:["name","country","link","rating","aid","deadline_text","deadlines","reqs","notes","created_at","updated_at","student_edits_reviewed_at",...UNI_EXTRA.map(x=>x[0])],
  apps:["student_id","uni_id","program","round","deadline_override","status","tier","note","grp","sort","rating","sat_range","reqs","deadline_text","aid","essay","supp","recs","docs","scores","result","amount","notes","created_at","updated_at"],
  tests:["student_id","date","test","kind","sections","total","comment","created_at","updated_at"],
  tasks:["student_id","kind","period","title","due","done","status","sort","created_at","updated_at"],
  meetings:["student_id","date","author","notes","next_steps","created_at","updated_at"],
  classes:["subject","teacher","pattern","time_start","time_end","room","sort","created_at","updated_at"],
  members:["class_id","student_id","created_at","updated_at"]};
const UNFIELD=Object.fromEntries(Object.entries(FIELD).map(([a,b])=>[b,a]));
function toRow(col,o){const r={};for(const k in o){const c=FIELD[k]||k;if(!COLS[col].includes(c))continue;let v=o[k];if(v===undefined)continue;if((["deadline_override","due","date"].includes(c)||(col==="unis"&&UNI_NULL.has(c)))&&!v)v=null;if(typeof v==="number"&&c!=="sort")v=String(v);r[c]=v}return r}
function fromRow(r){const o={};for(const k in r){const v=r[k];if(v===null)continue;o[UNFIELD[k]||k]=v}return o}
function makeDb(sb){
  const chk=({error})=>{if(error)throw error};
  return {
    doc(path){const [col,id]=path.split("/");return{
      update:async o=>{if(col==="settings")return chk(await sb.from("tracker_settings").upsert({key:id,value:o,updated_at:new Date().toISOString()}));chk(await sb.from(TABLES[col]).update(toRow(col,o)).eq("id",id))},
      set:async o=>{if(col==="settings")return chk(await sb.from("tracker_settings").upsert({key:id,value:o,updated_at:new Date().toISOString()}));chk(await sb.from(TABLES[col]).update(toRow(col,o)).eq("id",id))},
      delete:async()=>chk(await sb.from(TABLES[col]).delete().eq("id",id))}},
    collection(col){return{add:async o=>chk(await sb.from(TABLES[col]).insert(toRow(col,o)))}}
  };
}
function fail(e){const c=e&&e.code;
  if(c==="23503"){toast("Нельзя удалить: к этой записи привязаны заявки");return}
  if(c==="23505"){toast("Этот email уже привязан к другому студенту");return}
  if(c==="42501"||c==="PGRST301"){toast("Нет прав на изменение");return}
  console.error(e);toast("Не сохранилось. Проверьте интернет и попробуйте ещё раз")}
function clean(o){const r={};for(const k in o)if(o[k]!==undefined&&k!=="id")r[k]=o[k];return r}
async function save(col,id,data,prev){
  if(!S.db){toast("Нет связи с базой");return}
  try{if(id){await S.db.doc(col+"/"+id).update(data)}else{await S.db.collection(col).add({...data,createdAt:new Date().toISOString()})}toast("Сохранено");reload(col)}catch(e){fail(e)}
}
async function remove(col,id){if(!S.db)return;try{await S.db.doc(col+"/"+id).delete();toast("Удалено");reload(col);if(col==="students")reload("apps")}catch(e){fail(e)}}

let SB=null;
async function reload(col){
  if(!SB)return;
  if(col==="settings"){const {data}=await SB.from("tracker_settings").select("value").eq("key","lists").maybeSingle();if(data&&data.value)S.lists={curators:data.value.curators||[],teachers:DEFAULT_TEACHERS};render();return}
  const {data,error}=await SB.from(TABLES[col]).select("*").limit(5000);
  if(error){if(["tests","tasks","meetings","classes","members"].includes(col)){S.needsMigration=true;S.ready[col]=true;render();return}$("#sync").textContent="Ошибка загрузки — обновите страницу";console.error(error);return}
  const rows=data.map(fromRow);
  if(col==="apps"){S.rawApps=rows;S.ready.apps=true}else{S[col]=rows;S.ready[col]=true}
  resolveApps();render();
}
const pending={};const soon=col=>{clearTimeout(pending[col]);pending[col]=setTimeout(()=>{reload(col);if(col==="unis")reload("apps")},300)};

let loginRole="student";try{if(localStorage.getItem("gg-role")==="staff")loginRole="staff"}catch(e){}
function loginScreen(msg){
  const base=location.href.split("#")[0].split("?")[0].replace(/[^/]*$/,"");
  $("#main").innerHTML=`<div class="login"><h2>Вход в GetGrant</h2>
    <div class="seg2" role="tablist"><button type="button" role="tab" data-role="student" aria-selected="${loginRole==="student"}">Я студент</button><button type="button" role="tab" data-role="staff" aria-selected="${loginRole==="staff"}">Я куратор</button></div>
    ${msg?`<p class="note" style="color:var(--crit)">${msg}</p>`:""}
    <div id="r-student"${loginRole==="student"?"":" hidden"}><p class="note">Введите email, который вы дали куратору. Пришлём письмо со ссылкой — пароль не нужен.</p>
      <form id="s-form" class="grid" style="grid-template-columns:1fr"><label>Email<input id="s-email" type="email" autocomplete="email" required></label><div class="actions"><button class="btn primary" type="submit">Получить ссылку для входа</button></div></form>
      <p class="note" id="s-sent" hidden style="color:var(--good)">Письмо отправлено. Откройте его на этом устройстве и нажмите на ссылку. Нет письма — проверьте «Спам».</p></div>
    <div id="r-staff"${loginRole==="staff"?"":" hidden"}><p class="note">Вход для кураторов и администраторов по паролю.</p>
    <form id="login-form" class="grid" style="grid-template-columns:1fr"><label>Email<input id="l-email" type="email" autocomplete="username" required></label>
    <label>Пароль<input id="l-pass" type="password" autocomplete="current-password" required></label>
    <p class="note" id="l-err" hidden style="color:var(--crit)"></p><div class="actions"><button class="btn primary" type="submit">Войти</button><button class="btn" type="button" id="l-reset">Забыли пароль?</button></div></form></div></div>`;
  $("#tabs").hidden=true;
  document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{loginRole=b.dataset.role;try{localStorage.setItem("gg-role",loginRole)}catch(e){}loginScreen(msg)});
  $("#s-form").addEventListener("submit",async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;
    const {error}=await SB.auth.signInWithOtp({email:val("s-email").toLowerCase(),options:{emailRedirectTo:base+"student.html"}});b.disabled=false;
    if(error){toast(/rate|limit|seconds/i.test(error.message)?"Слишком много писем — подождите немного и попробуйте снова":"Не получилось отправить письмо: "+error.message);return}$("#s-sent").hidden=false});
  $("#login-form").addEventListener("submit",async e=>{e.preventDefault();let error;try{({error}=await SB.auth.signInWithPassword({email:val("l-email").toLowerCase(),password:$("#l-pass").value}))}catch(e){error=e}
    if(error){const m=String(error.message||error);const box=$("#l-err");
      box.textContent=/invalid login credentials/i.test(m)?"Supabase не нашёл такую пару email + пароль. Проверьте пользователя в Authentication → Users или создайте его заново.":
        /email not confirmed/i.test(m)?"Email не подтверждён. В Supabase удалите пользователя и создайте заново с галочкой Auto Confirm User.":
        /invalid api key|no api key|apikey|jwt|unauthorized/i.test(m)?"Неверный ключ в config.js. Скопируйте anon public key заново (шаг 5) и перезагрузите config.js в GitHub.":
        /failed to fetch|networkerror|load failed/i.test(m)?"Сайт не может связаться с Supabase. Проверьте адрес SUPABASE_URL в config.js (шаг 5).":
        "Ошибка входа: "+m;box.hidden=false}});
  $("#l-reset").onclick=async()=>{const email=val("l-email");if(!email){toast("Впишите email");return}const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.href.split("#")[0]});toast(error?"Не получилось отправить письмо":"Письмо для сброса пароля отправлено")};
}

function newPassword(){
  $("#tabs").hidden=true;
  $("#main").innerHTML=`<div class="login"><h2>Новый пароль</h2><form id="np-form" class="grid" style="grid-template-columns:1fr"><label>Новый пароль (минимум 8 символов)<input id="np-pass" type="password" autocomplete="new-password" minlength="8" required></label><div class="actions"><button class="btn primary" type="submit">Сохранить пароль</button></div></form></div>`;
  $("#np-form").addEventListener("submit",async e=>{e.preventDefault();const {error}=await SB.auth.updateUser({password:$("#np-pass").value});if(error){toast("Не получилось сменить пароль");return}toast("Пароль обновлён");location.hash="";const {data:{session}}=await SB.auth.getSession();started=false;start(session)});
}

let started=false;
async function start(session){
  if(!session){started=false;S.db=null;$("#sync").textContent="";$("#who").hidden=true;loginScreen();return}
  const email=session.user.email;
  const {data:staff}=await SB.from("tracker_staff").select("email").limit(1);
  if(!staff||!staff.length){
    try{const r=await SB.rpc("student_portal");if(r.data){location.replace("student.html");return}}catch(e){}
    loginScreen(`Email ${esc(email)} не найден ни среди кураторов, ни среди студентов. Студентам: попросите куратора вписать этот email в вашу карточку. Кураторам: попросите администратора добавить email в tracker_staff.`);$("#who").hidden=false;$("#who-email").textContent=email;return}
  $("#tabs").hidden=false;$("#who").hidden=false;$("#who-email").textContent=email;
  if(started)return;started=true;
  S.db=makeDb(SB);S.canWrite=true;S.me=email;
  $("#sync").textContent="Синхронизировано · изменения видны всей команде";
  render();
  await Promise.all([reload("students"),reload("unis"),reload("settings"),reload("tests"),reload("tasks"),reload("meetings"),reload("classes"),reload("members")]);await reload("apps");
  const ch=SB.channel("tracker");
  [["tracker_students","students"],["tracker_universities","unis"],["tracker_applications","apps"],["tracker_settings","settings"],["tracker_tests","tests"],["tracker_tasks","tasks"],["tracker_meetings","meetings"],["tracker_classes","classes"],["tracker_class_members","members"]].forEach(([t,c])=>ch.on("postgres_changes",{event:"*",schema:"public",table:t},()=>soon(c)));
  ch.subscribe();
}

(async()=>{
  const cfg=window.TRACKER_CONFIG||{};
  if(!window.supabase||!cfg.SUPABASE_URL||/YOUR-/.test(cfg.SUPABASE_URL)){$("#main").innerHTML='<div class="empty"><b>Трекер ещё не подключён к базе</b>Впишите адрес и ключ Supabase в файл config.js — инструкция в README.md.</div>';return}
  SB=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  $("#logout").onclick=async()=>{await SB.auth.signOut();location.reload()};
  const {data:{session}}=await SB.auth.getSession();
  await start(session);
  SB.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_IN"&&!started)start(s);if(ev==="SIGNED_OUT")start(null);if(ev==="PASSWORD_RECOVERY")newPassword()});
})();
})();
