<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GetGrant Трекер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600&display=swap">
<style>
/* Layout: sticky header with tabs; each tab = toolbar + one working table; edits in a side sheet. */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#eef2f9; --line:#dbe2ee;
  --fg:#16213a; --muted:#5c6a85; --accent:#1f4fd1; --accent-soft:#e3eafc; --accent-fg:#ffffff;
  --crit:#c2362b; --crit-soft:#fbe4e1; --warn:#9a6700; --warn-soft:#fdf1cf; --good:#1e7b43; --good-soft:#dcf2e4;
  --done:#7a8499; --done-soft:#eceff4;
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --surface:#151d31; --surface-2:#1b2540; --line:#2a3656;
  --fg:#e6ebf7; --muted:#9aa7c4; --accent:#7ea2ff; --accent-soft:#233463; --accent-fg:#0e1424;
  --crit:#ff8a7e; --crit-soft:#4a1f1d; --warn:#f0c14b; --warn-soft:#43361a; --good:#6fd39a; --good-soft:#193a2a;
  --done:#8791a8; --done-soft:#232b40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#151d31; --surface-2:#1b2540; --line:#2a3656;
  --fg:#e6ebf7; --muted:#9aa7c4; --accent:#7ea2ff; --accent-soft:#233463; --accent-fg:#0e1424;
  --crit:#ff8a7e; --crit-soft:#4a1f1d; --warn:#f0c14b; --warn-soft:#43361a; --good:#6fd39a; --good-soft:#193a2a;
  --done:#8791a8; --done-soft:#232b40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:14px 0}
.brand{font-family:var(--display);font-size:18px;letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);margin-left:auto}
.who{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.who .btn{padding:4px 10px;font-size:12px}
.seg2{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:4px;margin:12px 0}.seg2 button{font:inherit;font-weight:600;flex:1;border:0;background:none;color:var(--muted);padding:9px;border-radius:8px;cursor:pointer}.seg2 button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.login{max-width:380px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:10px}
nav button{font:inherit;font-weight:500;border:0;background:none;color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav button .n{font-size:12px;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
main{padding-top:20px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 200px;min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.toolbar select{width:auto;max-width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.danger.armed{background:var(--crit);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:12.5px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.done{background:var(--done-soft);color:var(--done)}
.dots{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line)}
.dot.s1{border-color:var(--warn);background:var(--warn-soft)}
.dot.s2{border-color:var(--accent);background:var(--accent-soft)}
.dot.s3{border-color:var(--good);background:var(--good)}
.dot.na{border-style:dashed;opacity:.5}
tr.past td{color:var(--done)}
tr.grp td{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;padding-block:7px;cursor:default}
tbody tr.grp:hover td{background:var(--accent-soft)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
/* summary */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.tile .v{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .l{color:var(--muted);font-size:12.5px;margin-top:4px}
.tile.alert .v{color:var(--crit)}
h2{font-size:15px;margin:0 0 10px;font-weight:600;text-wrap:balance}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.li{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li .t{flex:1;min-width:0}
.bars{display:grid;gap:8px;padding:14px}
.bar{display:grid;grid-template-columns:120px 1fr 28px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar .c{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.4);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line)}
.sheet h3{font-family:var(--display);font-size:17px;margin:0 0 16px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.schoolbar{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:4px;margin-bottom:14px;overflow-x:auto}.schoolbar button{font:inherit;font-size:13.5px;font-weight:600;border:0;background:none;color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}.schoolbar button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}.schoolbar .n{font-weight:500;color:var(--muted);margin-left:2px}
details.more{grid-column:1/-1;border-top:1px solid var(--line);margin-top:6px;padding-top:4px}details.more>summary{cursor:pointer;font-weight:600;color:var(--accent);padding:8px 0}details.more>.grid{margin-top:6px}
.sec{grid-column:1/-1;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:600;margin-top:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;align-items:center}
.actions .sp{flex:1}
.calc{font-family:var(--display);font-size:22px;color:var(--accent)}
.note{font-size:12px;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:30;font-size:13px}
.sheet.wide{width:min(940px,100%)}
.fs{border:0;padding:0;margin:0;min-width:0}
.card-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}.card-head>div{flex:1;min-width:0}.card-head h3{margin:0 0 2px}
.ctabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:10px 0 16px}
.ctabs button{font:inherit;font-weight:500;border:0;background:none;color:var(--muted);padding:9px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.ctabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.ctabs .n{font-size:11.5px;color:var(--muted);margin-left:4px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:8px}
.chart{margin:0;background:var(--surface-2);border-radius:10px;padding:10px 12px}.chart figcaption{font-size:13px;margin-bottom:4px}.chart svg{width:100%;height:auto;display:block}
.chart .cg{stroke:var(--line);stroke-width:1}.chart .ct{fill:var(--muted);font-size:11px;font-family:var(--body)}.chart .ctt{fill:var(--good)}.chart .cv{fill:var(--fg);font-weight:600}
.chart .ctarget{stroke:var(--good);stroke-width:1.5;stroke-dasharray:5 4}.chart .cl{fill:none;stroke:var(--accent);stroke-width:2}
.chart .cof{fill:var(--accent);stroke:var(--surface);stroke-width:2}.chart .cmk{fill:var(--surface);stroke:var(--accent);stroke-width:2}
table.mini{min-width:620px}table.mini td,table.mini th{padding:7px 9px}
.panel{background:var(--surface-2);border-radius:10px;padding:14px;margin:16px 0}.panel-h{font-weight:600;margin-bottom:10px}
.panel input,.panel select,.panel textarea{background:var(--surface)}
.mrow{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:6px;margin-bottom:6px}.mrow textarea{min-height:38px}
@media (max-width:640px){.mrow{grid-template-columns:1fr 1fr}.mrow textarea{grid-column:1/-1}}
.task{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px solid var(--line)}.task input{width:auto;margin-top:3px}
.task .tt{flex:1;min-width:0;cursor:pointer}.task.done .tt{color:var(--done);text-decoration:line-through}
.period{font-weight:600;margin:14px 0 2px;color:var(--accent);font-size:13.5px}
.tier{margin-top:14px}.tier-h{margin-bottom:6px}.tier-t{font-weight:600}
.meet{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:10px;background:var(--surface)}.meet-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.meet-h .sp{flex:1}.meet p{margin:6px 0}.meet ul{margin:4px 0 4px;padding-left:20px}
#report-root{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto}
.rep-bar{position:sticky;top:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}.rep-bar .sp{flex:1}
.rep-page{background:#fff;color:#111;max-width:860px;margin:20px auto;padding:36px 40px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
@media (max-width:600px){.rep-page{padding:20px 16px;margin:0}}
body.reporting{overflow:hidden}
@media print{body.reporting>*:not(#report-root){display:none!important}#report-root{position:static;overflow:visible;background:#fff}.rep-bar{display:none}.rep-page{box-shadow:none;margin:0;padding:0;max-width:none}body.reporting{overflow:visible}}
.gridbox{max-height:72vh;overflow:auto}
.gtable{min-width:0;width:auto;border-collapse:separate;border-spacing:0}
.gtable th,.gtable td{border-bottom:1px solid var(--line);padding:6px}
.gtable thead th{position:sticky;top:0;z-index:2;background:var(--surface-2)}
.gtable .gs{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;min-width:190px;max-width:230px;border-right:1px solid var(--line);cursor:pointer;font-weight:500;text-transform:none;letter-spacing:0;font-size:13px;color:var(--fg)}
.gtable .gs:hover{background:var(--surface-2)}
.gtable .gsn{display:block;margin-bottom:3px}
.gtable .gcorner{z-index:3;background:var(--surface-2);cursor:default;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.gh{vertical-align:bottom;min-width:86px;max-width:100px;white-space:normal;text-transform:none;letter-spacing:0;font-size:11.5px;color:var(--fg);text-align:center}
.gh.gfirst{border-left:2px solid var(--accent)}
.gh .gr{display:block;color:var(--accent);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;text-align:left;min-height:14px}
.gh .gn{display:block;font-weight:600;line-height:1.25}
.gh .gc-n{display:block;color:var(--muted);font-weight:400;font-size:11px}
.gcell{text-align:center;background:var(--surface)}
tbody tr:hover .gcell{background:var(--surface)}
.st{font:inherit;font-size:11.5px;font-weight:600;border:1px solid transparent;border-radius:6px;padding:4px 6px;min-width:72px;cursor:pointer;position:relative;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.st.plan{background:var(--surface-2);color:var(--muted)}
.st.prep{background:var(--warn-soft);color:var(--warn)}
.st.sent{background:var(--accent-soft);color:var(--accent)}
.st.ok{background:var(--good-soft);color:var(--good)}
.st.wait{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.st.no{background:var(--done-soft);color:var(--done);text-decoration:line-through}
.st.add{background:none;color:var(--line);border:1px dashed var(--line);min-width:40px}
.st.add:hover{color:var(--accent);border-color:var(--accent)}
.st i{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--crit);border:2px solid var(--surface)}
.st.leg{cursor:default;min-width:0;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.hotdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--crit);vertical-align:middle;margin-left:8px}
.menu{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(10,15,30,.18);padding:6px;min-width:220px;display:grid;gap:2px}
.menu-h{padding:6px 8px 8px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu button{font:inherit;font-size:13px;text-align:left;background:none;border:0;color:var(--fg);padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center}
.menu button:hover{background:var(--surface-2)}
.menu button.cur{background:var(--accent-soft)}
.picklist{display:grid;gap:2px;margin-top:12px;max-height:55vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.pick{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--fg);font-size:13.5px;cursor:pointer;grid-template-columns:none}
.pick:last-child{border-bottom:0}
.pickhead{position:sticky;top:0;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12.5px;padding:6px 12px}
.pick input{width:auto;margin-top:3px}
.pick .t{flex:1;min-width:0}
.pick .dl{display:block}
.pick.had{opacity:.6;cursor:default}
.appsel{width:auto;padding:4px 6px;font-size:12.5px}
.stud-mocks{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
.doc{display:grid;grid-template-columns:1fr auto auto auto;gap:8px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.doc .dn{min-width:0;overflow-wrap:anywhere}.doc select{max-width:190px}.dvis{display:flex!important;flex-direction:row!important;gap:6px;align-items:center;justify-content:flex-start;justify-self:start;white-space:nowrap;font-size:13px;color:var(--muted)}.dvis input{width:auto!important;margin:0}
.dact{display:flex;gap:6px;flex-wrap:wrap}.dact .btn{text-decoration:none}
.docs-up{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface-2)}
.docs-up input[type=file]{flex:1;min-width:200px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline}
.danger-zone{margin-top:22px;border-top:1px solid var(--line);padding-top:10px}.danger-zone summary{cursor:pointer;color:var(--crit)}
@media (max-width:720px){.doc{grid-template-columns:1fr}.doc select{max-width:none}}
.af-row{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,220px);gap:8px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.af-row .n{min-width:0;overflow-wrap:anywhere}.af-row select{width:100%;min-width:0}
@media (max-width:520px){.af-row{grid-template-columns:auto minmax(0,1fr)}.af-row select{grid-column:2}}
</style>
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>.rep{font-family:Arial,Helvetica,sans-serif;font-size:11pt;color:#111;line-height:1.4;max-width:800px;margin:0 auto}
.rep .r-title{font-size:16pt;font-weight:bold;text-align:center;margin:0 0 4px}.rep .r-name{font-size:14pt;font-weight:bold;text-align:center;margin:0}.rep .r-cycle{font-weight:bold;text-align:center;margin:0 0 14px}
.rep h2{font-size:12.5pt;margin:20px 0 8px;color:#1f4fd1}.rep h3{font-size:11.5pt;margin:14px 0 6px}

.rep ul{margin:4px 0 10px;padding-left:22px}.rep li{margin:3px 0}.rep .r-foot{color:#667;font-size:9pt;margin-top:24px;text-align:right}</style>

<body>
<header>
  <div class="wrap">
    <div class="head">
      <h1 class="brand">Get<span>Grant</span> · трекер</h1>
      <div class="sync" id="sync">Подключение…</div>
      <div class="who" id="who" hidden><span id="who-email"></span> <button class="btn" id="logout" type="button">Выйти</button></div>
    </div>
    <nav role="tablist" id="tabs">
      <button role="tab" data-tab="summary" aria-selected="true">Сводка</button>
      <button role="tab" data-tab="students" aria-selected="false">Студенты<span class="n" id="n-students"></span></button>
      <button role="tab" data-tab="apps" aria-selected="false">Заявки<span class="n" id="n-apps"></span></button>
      <button role="tab" data-tab="grid" aria-selected="false">Статусы</button>
      <button role="tab" data-tab="sched" aria-selected="false">Расписание</button>
      <button role="tab" data-tab="unis" aria-selected="false">Вузы<span class="n" id="n-unis"></span></button>
      <button role="tab" data-tab="settings" aria-selected="false">Списки</button>
    </nav>
  </div>
</header>

<div class="wrap"><main id="main"></main></div>
<div id="sheet-root"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(() => {
const COUNTRIES=["США","Великобритания","Канада","Австралия","Новая Зеландия","Сингапур","Гонконг","Китай","Южная Корея","Япония","Малайзия","ОАЭ","Катар","Турция","Нидерланды","Германия","Венгрия","Италия","Испания","Франция","Швейцария","Ирландия","Чехия","Латвия","Литва","Другое"];
const ROUNDS=["Early","Regular","Rolling"]; // как в student.html и tracker_valid_round() (миграция 009)
const WORK=["Не начато","В работе","На проверке","Готово","Не нужно"];
const CHECK=[["essay","Основное эссе"],["recs","Рекомендации"],["transcript","Транскрипт / оценки"],["tests","Результаты тестов"],["translation","Перевод документов"],["finance","Финансовые документы"]];
const ST_SHORT={"Планируем":"План","Готовим":"Готовим","Подано":"Подано","Интервью":"Интервью","Принят":"Принят","Лист ожидания":"Лист ож.","Отказ":"Отказ","Отозвано":"Отозвано"};
const ST_CLS={"Планируем":"plan","Готовим":"prep","Подано":"sent","Интервью":"sent","Принят":"ok","Лист ожидания":"wait","Отказ":"no","Отозвано":"no"};
const STATUS=["Планируем","Готовим","Подано","Интервью","Принят","Лист ожидания","Отказ","Отозвано"];
const SUBMITTED=new Set(["Подано","Интервью","Принят","Лист ожидания","Отказ","Отозвано"]);
const RESULT=["—","Полная стипендия","Частичная","Без стипендии"];
const STYPE=["В этом году","Позже"]; // «Когда поступает» (столбец type, миграция 012)
const TRACKS=["На грант","Партнёрские вузы"]; // «Тип поступления» (столбец track)
const SCHOOLS=["Центр GetGrant","Келечек MIT","Звёздочка"]; // «Где учится» (столбец school, миграция 013)
const schoolOf=s=>(s&&s.school)||SCHOOLS[0];
// общий переключатель школы: пусто — все; применяется к сводке, студентам, заявкам и статусам
const inSchool=s=>!S.f.school||schoolOf(s)===S.f.school;
const appInSchool=a=>!S.f.school||inSchool(studentOf(a.studentId)||{});
const SSTATUS=["Активен","Пауза","Завершил"];
const COURSES=["IELTS","SAT","Pre IELTS","Academic Writing","Grammar","Intensive","Pre-Intermediate","Intermediate","Upper-Intermediate","Advanced","Math","Индивидуально"];
const INTAKES=["Осень 2027","Весна 2027","Осень 2028","Осень 2029","Осень 2030","Не определено"];
const intakeIdx=v=>{const i=INTAKES.indexOf(v||"Не определено");return i<0?INTAKES.length:i};
const DEFAULT_TEACHERS=["Aziz","Dina","Saikal","Elnur","Beksultan","Umidjon"];

const S={tab:"summary",students:[],apps:[],rawApps:[],unis:[],tests:[],tasks:[],meetings:[],classes:[],members:[],me:"",mocks:[],lists:{curators:[],teachers:DEFAULT_TEACHERS},db:null,canWrite:true,ready:{students:false,apps:false,unis:false,tests:false,tasks:false,meetings:false,classes:false,members:false},
  f:{gint:"Осень 2027",gcur:"",gregion:"",uq:"",uregion:"",ucountry:"",ubudget:"",uielts:"",sq:"",sint:"",stype:"",strack:"",school:"",scur:"",aq:"",astat:"",acur:"",mstud:""}};
try{const t=localStorage.getItem("gg-tab");if(t&&["summary","students","apps","grid","sched","unis","settings"].includes(t))S.tab=t}catch(e){}

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opts=(arr,val,blank=true)=>(blank?'<option value=""></option>':"")+arr.map(o=>`<option${o===val?" selected":""}>${esc(o)}</option>`).join("")+(val&&!arr.includes(val)?`<option selected>${esc(val)}</option>`:"");
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const daysLeft=iso=>{if(!iso)return null;const a=Date.parse(iso+"T00:00:00Z"),b=Date.parse(todayISO()+"T00:00:00Z");return Math.round((a-b)/864e5)};
const fmtDate=iso=>{if(!iso)return"";const [y,m,d]=iso.split("-");return `${d}.${m}.${y}`};
const band=m=>{const v=[m.fc,m.lr,m.gra,m.p].map(Number);if([m.fc,m.lr,m.gra,m.p].some(x=>x===""||x==null)||v.some(x=>!isFinite(x)))return null;return Math.floor((v.reduce((a,b)=>a+b,0)/4)*2)/2};
const studentName=id=>(S.students.find(s=>s.id===id)||{}).name||"—";
const studentOf=id=>S.students.find(s=>s.id===id);
const uniOf=id=>S.unis.find(u=>u.id===id);
const REGIONS=["США","Европа","Азия","Другое"];
const REGION_OF={"США":"США","Великобритания":"Европа","Нидерланды":"Европа","Германия":"Европа","Венгрия":"Европа","Италия":"Европа","Турция":"Европа","Испания":"Европа","Франция":"Европа","Швейцария":"Европа","Ирландия":"Европа","Чехия":"Европа","Латвия":"Европа","Литва":"Европа","Австралия":"Другое","Новая Зеландия":"Другое","Канада":"Другое","Сингапур":"Азия","Гонконг":"Азия","Китай":"Азия","Южная Корея":"Азия","Япония":"Азия","Малайзия":"Азия","ОАЭ":"Азия","Катар":"Азия"};
const regionOf=u=>REGION_OF[(u&&u.country)||""]||"Другое";
const uniSort=(a,b)=>REGIONS.indexOf(regionOf(a))-REGIONS.indexOf(regionOf(b))||(a.country||"").localeCompare(b.country||"","ru")||(a.name||"").localeCompare(b.name||"","ru");
function resolveApps(){S.apps=S.rawApps.map(a=>{const u=uniOf(a.uniId);const cat=u&&u.deadlines&&a.round?u.deadlines[a.round]:"";return {...a,uni:u?u.name:(a.uni||"вуз удалён"),country:u?u.country:(a.country||""),deadline:a.deadlineOverride||cat||a.deadline||""}})}
const toast=msg=>{const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};

function dueChip(a){
  if(SUBMITTED.has(a.status))return `<span class="chip done">${esc(a.status)}</span>`;
  const d=daysLeft(a.deadline);if(d==null)return '<span class="chip">нет даты</span>';
  if(d<0)return `<span class="chip done">прошёл</span>`;
  const cls=d<=7?"crit":d<=21?"warn":"";const txt=d===0?"сегодня":`${d} дн.`;
  return `<span class="chip ${cls}">${txt}</span>`;
}
function statusChip(s){if(!s)return"";const c=s==="Принят"?"good":s==="Отказ"||s==="Отозвано"?"done":SUBMITTED.has(s)?"acc":"";return `<span class="chip ${c}">${esc(s)}</span>`}
function checkProg(s){const c=(s&&s.checklist)||{};let done=0,total=0;CHECK.forEach(([k])=>{const v=c[k]||"Не начато";if(v==="Не нужно")return;total++;if(v==="Готово")done++});return {done,total}}
function progChip(s){if(!s)return"";const {done,total}=checkProg(s);return `<span class="chip ${total&&done===total?"good":done?"acc":""}" title="Общие документы готовы: ${done} из ${total}">${done}/${total}</span>`}
function checkDots(s){const c=(s&&s.checklist)||{};return CHECK.map(([k,l])=>workDot(c[k],l)).join("")}
function workDot(v,label){const c=v==="Готово"?"s3":v==="На проверке"?"s2":v==="В работе"?"s1":v==="Не нужно"?"na":"";return `<span class="dot ${c}" title="${esc(label)}: ${esc(v||"Не начато")}"></span>`}

/* ---------- render ---------- */
function render(){
  closeMenu();
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  $("#n-students").textContent=S.students.length||"";
  $("#n-apps").textContent=S.apps.length||"";
  $("#n-unis").textContent=S.unis.length||"";
  const m=$("#main");
  const ro=S.canWrite?"":'<div class="banner">У вас доступ только на просмотр. Чтобы вносить изменения, попросите владельца дать вам уровень Contributor или выше.</div>';
  const mig=S.needsMigration?'<div class="banner">Нужно обновить базу: запустите в Supabase → SQL Editor файлы обновлений по порядку (update_02 … update_05.sql). Пока не запустите, часть разделов не работает.</div>':"";
  const sbar=["summary","students","apps","grid"].includes(S.tab)?schoolBar():"";
  m.innerHTML=ro+mig+sbar+({summary:vSummary,students:vStudents,apps:vApps,grid:vGrid,sched:vSched,unis:vUnis,settings:vSettings}[S.tab]||vSummary)();
  bindView();
}

function schoolBar(){const n=x=>S.students.filter(s=>!x||schoolOf(s)===x).length;
  return `<div class="seg schoolbar" role="tablist" aria-label="Где учится">${["",...SCHOOLS].map(x=>`<button type="button" role="tab" data-school="${esc(x)}" aria-selected="${(S.f.school||"")===x}">${x?esc(x):"Все"} <span class="n">${n(x)}</span></button>`).join("")}</div>`}
function vSummary(){
  const st=S.students.filter(inSchool), ap=S.apps.filter(appInSchool);
  const adm=st; // все студенты поступают (типа «Курсы» больше нет)
  const thisYear=st.filter(s=>s.type==="В этом году");
  const open=ap.filter(a=>!SUBMITTED.has(a.status));
  const d7=open.filter(a=>{const d=daysLeft(a.deadline);return d!=null&&d>=0&&d<=7});
  const d21=open.filter(a=>{const d=daysLeft(a.deadline);return d!=null&&d>=0&&d<=21});
  const noApps=thisYear.filter(s=>!ap.some(a=>a.studentId===s.id));
  const admitted=ap.filter(a=>a.status==="Принят");
  const tiles=[
    [st.length,"студентов всего"],[thisYear.length,"поступают в этом году"],[ap.length,"заявок в работе и подано"],
    [d7.length,"дедлайнов ≤ 7 дней",d7.length>0],[admitted.length,"поступлений"],[admitted.filter(a=>a.result==="Полная стипендия").length,"с полной стипендией"]
  ].map(([v,l,al])=>`<div class="tile${al?" alert":""}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
  const upcoming=open.filter(a=>{const d=daysLeft(a.deadline);return d!=null&&d>=0}).sort((a,b)=>a.deadline.localeCompare(b.deadline)).slice(0,10);
  const upHtml=upcoming.length?upcoming.map(a=>`<div class="li" data-open-app="${esc(a.id)}"><div class="t"><div><b>${esc(studentName(a.studentId))}</b> · ${esc(a.uni||"вуз не указан")}</div><div class="sub">${esc([a.country,a.round,fmtDate(a.deadline)].filter(Boolean).join(" · "))}</div></div>${progChip(studentOf(a.studentId))}${dueChip(a)}</div>`).join("")
    :`<div class="empty"><b>Ближайших дедлайнов нет</b>Добавьте заявки во вкладке «Заявки» — здесь появятся 10 ближайших.</div>`;
  const cur={};adm.forEach(s=>{const k=s.curator||"Без куратора";cur[k]=(cur[k]||0)+1});
  const max=Math.max(1,...Object.values(cur));
  const curHtml=Object.keys(cur).length?`<div class="bars">${Object.entries(cur).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${v/max*100}%"></div></div><span class="c">${v}</span></div>`).join("")}</div>`
    :`<div class="empty">Назначьте студентам кураторов — здесь будет нагрузка по кураторам.</div>`;
  const byInt={};st.forEach(s=>{const k=s.intake||"Не определено";byInt[k]=(byInt[k]||0)+1});
  const imax=Math.max(1,...Object.values(byInt));
  const intHtml=st.length?`<div class="bars">${Object.entries(byInt).sort((a,b)=>intakeIdx(a[0])-intakeIdx(b[0])).map(([k,v])=>`<div class="bar" data-intake="${esc(k)}" style="cursor:pointer"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${v/imax*100}%"></div></div><span class="c">${v}</span></div>`).join("")}</div>`:`<div class="empty">Студентов пока нет.</div>`;
  const overdue=S.tasks.filter(t=>!t.done&&t.due&&daysLeft(t.due)<0&&inSchool(studentOf(t.studentId)||{})).sort((a,b)=>a.due.localeCompare(b.due));
  const below=[];adm.forEach(s=>Object.entries(s.targets||{}).forEach(([t,g])=>{const b=bestScore(s.id,t);if(!b)return;const cur=num(b.total),goal=num(g);if(cur!=null&&goal!=null&&cur<goal)below.push({s,t,cur:fmtScore(t,cur),goal:fmtScore(t,goal),gap:fmtScore(t,+(goal-cur).toFixed(1))})}));below.sort((a,b)=>num(b.gap)-num(a.gap));
  const quiet=adm.filter(s=>{const m=lastMeeting(s.id);return !m||daysLeft(m.date)<-30});
  const noAppsHtml=noApps.length?noApps.map(s=>`<div class="li" data-open-student="${esc(s.id)}"><div class="t">${esc(s.name)}<div class="sub">${esc(s.curator||"куратор не назначен")}</div></div><span class="chip warn">нет заявок</span></div>`).join(""):`<div class="empty">У всех, кто поступает в этом году, есть заявки.</div>`;
  return `<div class="tiles">${tiles}</div>
  <div class="cols">
    <section><h2>Ближайшие дедлайны${d21.length?` <span class="sub">· ${d21.length} в ближайшие 3 недели</span>`:""}</h2><div class="list">${upHtml}</div>
      <p class="note">Дробь — сколько общих документов студента готово (эссе, рекомендации, транскрипт и т.д.).</p></section>
    <section><h2>Студенты по сезону поступления</h2><div class="list">${intHtml}</div>
      <h2 style="margin-top:20px">Нагрузка кураторов</h2><div class="list">${curHtml}</div>
      <h2 style="margin-top:20px">Поступают в этом году, но нет заявок</h2><div class="list">${noAppsHtml}</div></section>
  </div>
  <div class="cols" style="margin-top:24px">
    <section><h2>Просроченные задачи${overdue.length?` <span class="sub">· ${overdue.length}</span>`:""}</h2><div class="list">${overdue.length?overdue.slice(0,12).map(t=>`<div class="li" data-open-student="${esc(t.studentId)}"><div class="t"><b>${esc(studentName(t.studentId))}</b><div class="sub">${esc(t.title.split("\n")[0].slice(0,110))}</div></div><span class="chip crit">${fmtDate(t.due)}</span></div>`).join(""):'<div class="empty">Просроченных задач нет.</div>'}</div></section>
    <section><h2>Ниже цели по тестам</h2><div class="list">${below.length?below.slice(0,12).map(b=>`<div class="li" data-open-student="${esc(b.s.id)}"><div class="t"><b>${esc(b.s.name)}</b><div class="sub">${esc(b.t)}: ${esc(b.cur)} → цель ${esc(b.goal)}</div></div><span class="chip warn">−${esc(b.gap)}</span></div>`).join(""):'<div class="empty">Все, у кого указана цель, её достигли — или цели ещё не заданы (вкладка «Тесты» в карточке).</div>'}</div>
      <h2 style="margin-top:20px">Давно без встречи <span class="sub">· 30+ дней</span></h2><div class="list">${quiet.length?`<div class="li" style="cursor:default"><div class="t sub">${quiet.slice(0,30).map(s=>`<a href="#" data-open-student="${esc(s.id)}">${esc(s.name)}</a>`).join(", ")}${quiet.length>30?` и ещё ${quiet.length-30}`:""}</div></div>`:'<div class="empty">Со всеми поступающими встречались в последние 30 дней.</div>'}</div></section>
  </div>`;
}

function vStudents(){
  const f=S.f;const q=f.sq.trim().toLowerCase();
  const rows=S.students.filter(s=>inSchool(s)&&(!q||[s.name,s.major,s.countries,s.notes].join(" ").toLowerCase().includes(q))&&(!f.sint||(s.intake||"Не определено")===f.sint)&&(!f.stype||s.type===f.stype)&&(!f.strack||s.track===f.strack)&&(!f.scur||(s.curator||"")===f.scur))
    .sort((a,b)=>intakeIdx(a.intake)-intakeIdx(b.intake)||(a.name||"").localeCompare(b.name||"","ru"));
  let grp=null;
  const body=rows.map(s=>{const n=S.apps.filter(a=>a.studentId===s.id).length;
    const g=s.intake||"Не определено";let head="";
    if(g!==grp){grp=g;const cnt=rows.filter(x=>(x.intake||"Не определено")===g).length;head=`<tr class="grp"><td colspan="9">${esc(g)} <span class="sub">· ${cnt}</span></td></tr>`}
    return head+`<tr data-open-student="${esc(s.id)}"><td><b>${esc(s.name)}</b>${schoolOf(s)!==SCHOOLS[0]?` <span class="chip warn">${esc(schoolOf(s))}</span>`:""}<div class="sub">${esc(s.major||"")}</div></td><td>${esc(s.grade||"")}${s.type||s.track?`<div>${s.type?`<span class="chip ${s.type==="В этом году"?"acc":""}">${esc(s.type)}</span>`:""}${s.track?` <span class="chip">${esc(s.track)}</span>`:""}</div>`:""}${s.status&&s.status!=="Активен"?` <span class="chip done">${esc(s.status)}</span>`:""}</td><td>${esc(s.curator||"")}</td><td>${progChip(s)}${(()=>{const o=S.tasks.filter(t=>t.studentId===s.id&&!t.done);const late=o.filter(t=>t.due&&daysLeft(t.due)<0).length;return o.length?` <span class="chip ${late?"crit":""}" title="Открытых задач${late?", из них просрочено "+late:""}">${o.length} зад.</span>`:""})()}</td>
    <td class="num">${scoreCell(s,"IELTS","ielts")}${bestScore(s.id,"TOEFL")||s.toefl?`<div class="sub">TOEFL ${scoreCell(s,"TOEFL","toefl")}</div>`:""}</td><td class="num">${scoreCell(s,"SAT","sat")}</td><td class="num">${scoreCell(s,"ОРТ","ort")}</td><td class="num">${n||""}</td><td class="sub">${esc(s.countries||"")}</td></tr>`}).join("");
  return `<div class="toolbar"><input class="grow" id="f-sq" placeholder="Поиск: имя, специальность, страна" value="${esc(f.sq)}">
    <select id="f-sint"><option value="">Все сезоны</option>${opts(INTAKES,f.sint,false)}</select>
    <select id="f-stype"><option value="">Когда поступает: все</option>${opts(STYPE,f.stype,false)}</select>
    <select id="f-strack"><option value="">Грант и партнёрские</option>${opts(TRACKS,f.strack,false)}</select>
    <select id="f-scur"><option value="">Все кураторы</option>${opts(S.lists.curators,f.scur,false)}</select>
    ${S.canWrite?'<button class="btn" id="auto-folders" title="Найти папки студентов на Google Диске по имени и привязать">Папки на Диске</button><button class="btn primary" id="add-student">+ Студент</button>':""}</div>
    <div class="tablebox">${S.students.length?`<table><thead><tr><th>Студент</th><th>Класс / тип</th><th>Куратор</th><th>Документы</th><th class="num">IELTS</th><th class="num">SAT</th><th class="num">ОРТ</th><th class="num">Заявок</th><th>Страны</th></tr></thead><tbody>${body||'<tr><td colspan="9" class="empty">Никто не подходит под фильтр.</td></tr>'}</tbody></table>`
      :`<div class="empty"><b>${S.ready.students?"Студентов пока нет":"Загружаю студентов…"}</b>${S.ready.students?"Нажмите «+ Студент», чтобы добавить первого.":""}</div>`}</div>`;
}

function vApps(){
  const f=S.f;const q=f.aq.trim().toLowerCase();
  const rows=S.apps.filter(a=>{const s=studentOf(a.studentId)||{};return inSchool(s)&&(!q||[s.name,a.uni,a.program,a.country].join(" ").toLowerCase().includes(q))&&(!f.astat||(f.astat==="__open"?!SUBMITTED.has(a.status):a.status===f.astat))&&(!f.acur||(s.curator||"")===f.acur)})
    .sort((a,b)=>{const pa=SUBMITTED.has(a.status)||daysLeft(a.deadline)<0?1:0,pb=SUBMITTED.has(b.status)||daysLeft(b.deadline)<0?1:0;if(pa!==pb)return pa-pb;return(a.deadline||"9999").localeCompare(b.deadline||"9999")});
  const body=rows.map(a=>{const s=studentOf(a.studentId)||{};const past=SUBMITTED.has(a.status)||daysLeft(a.deadline)<0;
    return `<tr data-open-app="${esc(a.id)}" class="${past?"past":""}"><td><b>${esc(s.name||"—")}</b>${s.id&&schoolOf(s)!==SCHOOLS[0]?` <span class="chip warn">${esc(schoolOf(s))}</span>`:""}<div class="sub">${esc(s.curator||"")}</div></td><td>${esc(a.uni||"")}${a.addedBy==="student"?' <span class="chip acc" title="Студент добавил этот вуз сам в личном кабинете">от студента</span>':""}${a.studentNote?' <span class="chip" title="Есть заметка студента — откройте заявку">заметка</span>':""}<div class="sub">${esc(a.program||"")}</div></td><td>${esc(a.country||"")}</td><td>${esc(a.round||"")}</td><td class="num">${fmtDate(a.deadline)}</td><td>${dueChip(a)}</td>

const TESTS={

  "SAT":{secs:["Reading & Writing","Math"],calc:v=>v.reduce((x,y)=>x+y,0),min:400,max:1600,step:10},

const lines=t=>String(t||"").split("\n").map(x=>x.trim().replace(/^[-•·]\s*/,"")).filter(Boolean);
const num=v=>{const n=parseFloat(String(v??"").replace(",","."));return isFinite(n)?n:null};
const fmtScore=(t,v)=>v==null?"":(t==="IELTS"?Number(v).toFixed(1):String(v));
const boldLead=t=>{const m=String(t).match(/^([^:]{2,60}):\s*(.*)$/s);return m?`<b>${esc(m[1])}:</b> ${esc(m[2])}`:esc(t)};

function bestScore(id,test){const all=S.tests.filter(t=>t.studentId===id&&t.test===test&&num(t.total)!=null);const off=all.filter(t=>t.kind==="Официальный");return (off.length?off:all).sort((a,b)=>num(b.total)-num(a.total))[0]}
// ячейка балла: из тестов (с пометкой «пробн.»), иначе вписанное вручную
function scoreCell(s,test,field){const b=bestScore(s.id,test);if(!b)return esc(s[field]||"");return esc(fmtScore(test,num(b.total)))+(b.kind==="Официальный"?"":' <span class="sub" title="Лучший пробный тест от '+esc(fmtDate(b.date))+' — официальных пока нет">пробн.</span>')}
function bestOfficial(id,test){const o=S.tests.filter(t=>t.studentId===id&&t.test===test&&t.kind==="Официальный"&&num(t.total)!=null);return o.sort((a,b)=>num(b.total)-num(a.total))[0]}

/* --- tests --- */
function testChart(sid,test){
  const all=studentTests(sid).filter(t=>t.test===test&&num(t.total)!=null&&t.date);
  if(!all.length)return "";
  const cfg=TESTS[test]||{},target=num((studentOf(sid).targets||{})[test]);
  const vals=all.map(t=>num(t.total)).concat(target!=null?[target]:[]);
  let lo=Math.min(...vals),hi=Math.max(...vals);const pad=Math.max((hi-lo)*0.15,(cfg.step||1)*2);lo=Math.max(cfg.min??-1e9,lo-pad);hi=Math.min(cfg.max??1e9,hi+pad);if(hi<=lo)hi=lo+1;
  const W=560,H=170,L=44,R=16,T=14,Bm=28;const t0=Date.parse(all[0].date),t1=Date.parse(all.at(-1).date);
  const X=d=>all.length===1?L+(W-L-R)/2:L+(Date.parse(d)-t0)/(t1-t0||1)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-Bm);
  const ticks=[lo,(lo+hi)/2,hi].map(v=>test==="IELTS"?Math.round(v*2)/2:Math.round(v));
  const path=all.map((t,i)=>`${i?"L":"M"}${X(t.date).toFixed(1)} ${Y(num(t.total)).toFixed(1)}`).join("");
  return `<figure class="chart"><figcaption><b>${esc(test)}</b>${target!=null?` · цель ${fmtScore(test,target)}`:""}</figcaption>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Прогресс ${esc(test)}">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" class="cg"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" class="ct">${fmtScore(test,v)}</text>`).join("")}
    ${target!=null?`<line x1="${L}" x2="${W-R}" y1="${Y(target)}" y2="${Y(target)}" class="ctarget"/><text x="${W-R}" y="${Y(target)-5}" text-anchor="end" class="ct ctt">цель</text>`:""}
    <path d="${path}" class="cl"/>
    ${all.map(t=>`<circle cx="${X(t.date)}" cy="${Y(num(t.total))}" r="5" class="${t.kind==="Официальный"?"cof":"cmk"}"><title>${fmtDate(t.date)} · ${esc(t.kind||"")} · ${fmtScore(test,num(t.total))}</title></circle>`).join("")}
    ${[all[0],all.at(-1)].filter((t,i,a)=>i===0||t!==a[0]).map(t=>`<text x="${X(t.date)}" y="${H-8}" text-anchor="middle" class="ct">${fmtDate(t.date).slice(0,5)}.${t.date.slice(2,4)}</text>`).join("")}
    <text x="${X(all.at(-1).date)}" y="${Y(num(all.at(-1).total))-10}" text-anchor="middle" class="ct cv">${fmtScore(test,num(all.at(-1).total))}</text>
  </svg><div class="sub">● официальный · ○ пробный</div></figure>`;
}
function testForm(t){
  const test=t.test||"IELTS",cfg=TESTS[test]||{secs:[]};const secs=cfg.secs||[];
  return `<div class="grid tform">

  ${S.canWrite?`<div class="panel" id="t-panel"><div class="panel-h" id="t-title">Новая попытка</div><div id="t-formwrap">${testForm({})}</div>

  <div class="sec">Другие показатели для отчёта <span class="sub" style="text-transform:none;letter-spacing:0">— GPA, достижения, статус абитуриента, «SAT: не сдавал»…</span></div>
  <fieldset class="fs"${ro()}><div id="m-rows">${(s.metrics||[]).map((m,i)=>metricRow(m,i)).join("")}</div>
  ${S.canWrite?'<button class="btn" id="m-add" type="button">+ Показатель</button>':""}</fieldset>
  <p class="note">Стратегия по тестам — во вкладке «Для отчёта».</p>
  ${S.canWrite?'<div class="actions"><span class="sp"></span><button class="btn primary" id="m-save">Сохранить цели и показатели</button></div>':""}`;
}
const metricRow=(m,i)=>`<div class="mrow"><input placeholder="Показатель" data-m="label" value="${esc(m.label)}"><input placeholder="Результат" data-m="result" value="${esc(m.result)}"><textarea placeholder="Комментарий" data-m="comment">${esc(m.comment)}</textarea>${S.canWrite?'<button class="btn" type="button" data-mdel title="Удалить">×</button>':""}</div>`;
function bTests(s){
  if(!S.canWrite)return;
  let editing=null;

const DOC_TYPES=["Паспорт","Аттестат / транскрипт","Сертификат IELTS/SAT","Рекомендательное письмо","Эссе","Согласие родителей","Портфолио","Финансовые документы","Другое"];
const fmtSize=b=>b==null?"":b<1024*1024?Math.max(1,Math.round(b/1024))+" КБ":(b/1048576).toFixed(1).replace(".",",")+" МБ";
async function driveCall(body,raw){
  const cfg=window.TRACKER_CONFIG||{};const {data:{session}}=await SB.auth.getSession();const isF=body instanceof FormData;
  let r;try{r=await fetch(String(cfg.SUPABASE_URL).replace(/\/+$/,"")+"/functions/v1/drive",{method:"POST",headers:{Authorization:"Bearer "+((session&&session.access_token)||""),apikey:cfg.SUPABASE_ANON_KEY,...(isF?{}:{"Content-Type":"application/json"})},body:isF?body:JSON.stringify(body)})}
  catch(e){throw new Error("Нет связи с сервером документов. Проверьте интернет.")}
  if(raw&&r.ok)return r;
  const d=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===404&&!d.error)throw new Error("Документы ещё не подключены: в Supabase нет функции drive (см. инструкцию «Документы на Google Диске»).");throw new Error(d.error||d.message||("Ошибка "+r.status))}
  return d;
}
async function driveDownload(body){const r=await driveCall({...body,action:"download"},true);const name=decodeURIComponent(r.headers.get("x-file-name")||"файл");const url=URL.createObjectURL(await r.blob());const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}

/* --- автопривязка папок: в корне Диска папки названы по имени латиницей (Abdualim), написание бывает разное --- */
const TRANSLIT={а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"yo",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"kh",ц:"ts",ч:"ch",ш:"sh",щ:"sch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya",ө:"o",ү:"u",ң:"ng",ә:"a",қ:"k",ғ:"g",һ:"h",і:"i"};
// Кириллицу и латиницу приводим к одному «звучанию»: Абдуалим, Abdualim, Abdualeem, Abdualym → abdualim; Айжан, Aizhan, Aijan → aijan
const nameKey=w=>String(w||"").toLowerCase().replace(/[а-яёөүңәқғһі]/g,c=>TRANSLIT[c]).normalize("NFD").replace(/[^a-z]/g,"")
  .replace(/dzh|dj/g,"j").replace(/zh/g,"j").replace(/kh/g,"h").replace(/ph/g,"f").replace(/shch|sch/g,"sh").replace(/q/g,"k").replace(/x/g,"ks").replace(/w/g,"v").replace(/c(?!h)/g,"k")
  .replace(/ee/g,"i").replace(/oo|ou/g,"u").replace(/y/g,"i").replace(/(.)\1+/g,"$1");
const nameTokens=s=>String(s||"").split(/[^\p{L}\p{N}]+/u).filter(t=>t&&!/\d/.test(t)).map(nameKey).filter(t=>t.length>=2);
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const tokSim=(a,b)=>{const L=Math.max(a.length,b.length);if(!L)return 0;const s=1-lev(a,b)/L;return L<=4&&a!==b?s-.15:s};
// Насколько папка похожа на студента: лучшее совпадение слов + небольшой бонус, если совпало несколько слов (имя и фамилия)
function folderScore(fToks,sToks){let best=0,hits=0;fToks.forEach(f=>{const m=Math.max(0,...sToks.map(s=>tokSim(f,s)));best=Math.max(best,m);if(m>=.8)hits++});return best+(hits>1?.05*(hits-1):0)}
function matchFolders(students,folders){
  const ft=folders.map(f=>nameTokens(f.name)),st=students.map(s=>nameTokens(s.name));
  const sc=students.map((s,i)=>folders.map((f,j)=>folderScore(ft[j],st[i])));
  const pairs=[];sc.forEach((row,i)=>row.forEach((v,j)=>{if(v>=.7)pairs.push([v,i,j])}));pairs.sort((a,b)=>b[0]-a[0]);
  const usedS=new Set(),usedF=new Set(),pick={};
  pairs.forEach(([v,i,j])=>{if(usedS.has(i)||usedF.has(j))return;usedS.add(i);usedF.add(j);
    // «несколько вариантов»: та же папка почти так же похожа на другого студента, или у студента есть почти такая же другая папка
    const rival=sc.some((r,k)=>k!==i&&r[j]>=v-.05)||sc[i].some((x,k)=>k!==j&&x>=v-.05);
    pick[students[i].id]={folder:folders[j],score:v,rival}});
  return {pick,sc};
}
async function autoFoldersSheet(){
  openSheet(`<h3>Папки студентов на Диске</h3><div id="af-box"><p class="note">Смотрю папки на Google Диске…</p></div>`);
  let d;try{d=await driveCall({action:"folders"})}catch(e){const b=$("#af-box");if(b)b.innerHTML=`<p class="note" style="color:var(--crit)">${esc(e.message)}</p>`;return}
  const box=$("#af-box");if(!box)return;
  const linkedIds=new Set(S.students.map(s=>s.drive_folder_id).filter(Boolean));
  const folders=d.folders.filter(f=>!linkedIds.has(f.id)).sort((a,b)=>a.name.localeCompare(b.name,"ru"));
  const studs=S.students.filter(s=>!s.drive_folder_id).sort((a,b)=>(a.name||"").localeCompare(b.name||"","ru"));
  const done=S.students.length-studs.length;
  if(!studs.length){box.innerHTML=`<p class="note" style="margin-top:0">У всех студентов (${done}) папка уже привязана.</p><div class="actions"><span class="sp"></span><button class="btn" id="cancel">Закрыть</button></div>`;$("#cancel").onclick=closeSheet;return}
  const {pick,sc}=matchFolders(studs,folders);
  const used=new Set(Object.values(pick).map(p=>p.folder.id));
  const row=(s,i)=>{const p=pick[s.id];const sure=p&&!p.rival&&p.score>=.85;
    const cands=folders.map((f,j)=>[sc[i][j],f]).filter(([v])=>v>=.5).sort((a,b)=>b[0]-a[0]).slice(0,6).map(x=>x[1]);
    const o=f=>`<option value="${esc(f.id)}"${p&&p.folder.id===f.id?" selected":""}>${esc(f.name)}</option>`;
    const chip=!p?'<span class="chip">не нашлось</span>':p.rival?'<span class="chip warn">несколько вариантов — проверьте</span>':p.score>=.95?'<span class="chip good">совпадает</span>':'<span class="chip warn">похоже — проверьте</span>';
    return `<div class="af-row"><input type="checkbox" data-afchk="${esc(s.id)}" aria-label="Привязать"${sure?" checked":""}><div class="n"><b>${esc(s.name)}</b> ${chip}</div>
      <select data-afsel="${esc(s.id)}" aria-label="Папка для ${esc(s.name)}"><option value="">— не привязывать —</option>${cands.length?`<optgroup label="Похожие">${cands.map(o).join("")}</optgroup>`:""}<optgroup label="Все папки">${folders.filter(f=>!cands.includes(f)).map(o).join("")}</optgroup></select></div>`};
  const spare=folders.filter(f=>!used.has(f.id));
  box.innerHTML=`<p class="note" style="margin-top:0">Трекер сравнил имена студентов с названиями папок в корневой папке Диска с учётом разного написания латиницей. Отмечены только уверенные совпадения. Остальные проверьте, выберите папку и поставьте галочку.${done?` Уже привязано: ${done}.`:""}</p>
    ${folders.length?"":`<p class="note" style="color:var(--crit)">В корневой папке нет свободных папок.</p>`}
    <div>${studs.map(row).join("")}</div>
    ${spare.length?`<p class="note">Папки, для которых не нашлось студента (${spare.length}): ${esc(spare.map(f=>f.name).join(", "))}</p>`:""}
    <div class="actions"><span class="sp"></span><button class="btn" id="cancel">Отмена</button><button class="btn primary" id="af-go">Привязать</button></div>`;
  const count=()=>{const n=box.querySelectorAll("[data-afchk]:checked").length;$("#af-go").textContent=n?`Привязать ${n}`:"Привязать"};
  box.querySelectorAll("[data-afsel]").forEach(sel=>sel.onchange=()=>{box.querySelector(`[data-afchk="${CSS.escape(sel.dataset.afsel)}"]`).checked=!!sel.value;count()});
  box.querySelectorAll("[data-afchk]").forEach(c=>c.onchange=()=>{if(c.checked&&!box.querySelector(`[data-afsel="${CSS.escape(c.dataset.afchk)}"]`).value){c.checked=false;toast("Сначала выберите папку")}count()});
  count();$("#cancel").onclick=closeSheet;
  $("#af-go").onclick=async e=>{
    const todo=[...box.querySelectorAll("[data-afchk]:checked")].map(c=>({sid:c.dataset.afchk,fid:box.querySelector(`[data-afsel="${CSS.escape(c.dataset.afchk)}"]`).value})).filter(x=>x.fid);
    if(!todo.length){toast("Отметьте, кого привязать");return}
    const seen={};for(const t of todo){if(seen[t.fid]){const f=folders.find(x=>x.id===t.fid);toast(`Папка «${f?f.name:""}» выбрана для двух студентов: ${studentName(seen[t.fid])} и ${studentName(t.sid)}`);return}seen[t.fid]=t.sid}
    const btn=e.target;btn.disabled=true;let okN=0;
    for(const t of todo){btn.textContent=`Привязываю ${okN+1}/${todo.length}…`;try{await driveCall({action:"link",studentId:t.sid,folder:t.fid});okN++}catch(err){toast(studentName(t.sid)+": "+err.message)}}

/* --- university groups (shared by card and report) --- */
const bySort=(x,y)=>((x.sort??1e9)-(y.sort??1e9))||(x.deadline||"9999").localeCompare(y.deadline||"9999")||(x.uni||"").localeCompare(y.uni||"");
function uniGroups(s){
  const apps=S.apps.filter(a=>a.studentId===s.id);
  if(apps.some(a=>a.grp)){
    const names=[];apps.filter(a=>a.grp).sort(bySort).forEach(a=>{if(!names.includes(a.grp))names.push(a.grp)});
    const g=names.map(n=>({key:n,title:n,mode:"grp",list:apps.filter(a=>a.grp===n).sort(bySort)}));
    const rest=apps.filter(a=>!a.grp).sort(bySort);if(rest.length)g.push({key:"",title:"Другие вузы",mode:"grp",list:rest,other:true});
    return g;
  }
  const titles=s.tierTitles||{};
  return [...TIERS,""].map(t=>({key:t,tier:t,title:t?(titles[t]||TIER_DEFAULT[t]):"Другие вузы",mode:"tier",list:apps.filter(a=>(a.tier||"")===t).sort(bySort),other:!t}));
}
const aField=(a,u,f)=>a[f]||u[f]||"";
const fmtRating=v=>String(v||"").replace(/^QS\s+/,"");
function aidHTML(x,note){x=String(x||"");let h;
  if(x.includes("\n")){const [f,...r]=x.split("\n");h=`<b>${esc(f)}</b>${r.length?"<br>"+esc(r.join("\n")).replace(/\n/g,"<br>"):""}`}
  else{const m=x.match(/^(.{3,90}?[.:])\s+(.+)$/s);h=m?`<b>${esc(m[1])}</b> ${esc(m[2])}`:esc(x)}
  return h+(note?`${x?"<br>":""}<i>${esc(note)}</i>`:"")}
function groupTable(s,grp,T){
  const l=grp.list;const U=a=>uniOf(a.uniId)||{};
  const has=(fn)=>{const c=l.filter(a=>fn(a)).length;return c>=Math.min(2,l.length)};
  const ratingOf=a=>fmtRating(aField(a,U(a),"rating"));
  const countries=new Set(l.map(a=>U(a).country||""));
  const cols=[];
  const gov=grp.mode==="tier"&&grp.tier==="Гос. стипендия";
  const g2=grp.mode==="grp";const vis=(f)=>g2?has(a=>a[f]):has(a=>aField(a,U(a),f));
  const showRating=!gov&&(g2?has(a=>a.rating&&a.rating!=="—")||has(a=>a.rating):has(a=>ratingOf(a)&&ratingOf(a)!=="—"));
  const showCountry=gov||(countries.size>1&&!showRating&&!has(a=>a.satRange)&&!vis("reqs"));
  if(showCountry)cols.push(["Страна",a=>`<b>${esc(U(a).country||"")}</b>`]);
  cols.push([gov?"Программа":"Университет",a=>`<b>${esc(a.uni)}</b>`]);
  if(showRating){const allNum=l.every(a=>!ratingOf(a)||/^[\d—–-]+$/.test(ratingOf(a)));cols.push([allNum?"QS":"Рейтинг",a=>esc(ratingOf(a)||"—")])}
  if(has(a=>a.satRange))cols.push(["SAT",a=>esc(a.satRange||"—")]);
  if(vis("reqs"))cols.push(["Требования",a=>esc(aField(a,U(a),"reqs"))]);
  if(has(a=>a.program))cols.push(["Программы",a=>esc(a.program||"").replace(/\n/g,"<br>")]);
  if(grp.mode==="grp"&&(s.reportOpts||{}).showTier)cols.push(["Приоритет",a=>`<b>${esc(a.tier||"")}</b>`]);
  cols.push(["Дедлайн подачи",a=>esc(a.deadlineText||U(a).deadlineText||dlSummary(U(a))||(a.deadline?fmtDate(a.deadline):"")).replace(/\n/g,"<br>")]);
  if(g2?(has(a=>a.aid)||l.some(a=>a.note)):l.some(a=>aField(a,U(a),"aid")||a.note))cols.push(["Финансовая поддержка",a=>aidHTML(aField(a,U(a),"aid"),a.note)]);
  return T(cols.map(c=>c[0]),l.map(a=>`<tr>${cols.map(c=>`<td>${c[1](a)}</td>`).join("")}</tr>`));
}

/* --- report --- */
function cycleOf(s){const m=String(s.intake||"").match(/(\d{4})/);if(!m)return s.intake||"";const y=+m[1];return /Весна/.test(s.intake)?`${y-1}-${y}`:`${y-1}-${y}`}
function reportHTML(id){
  const s=studentOf(id);const T=(h,rows)=>`<table class="rt"><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`;
  const tests=studentTests(id);const types=[...new Set(tests.map(t=>t.test))];
  const trow=types.map(tt=>{const b=bestOfficial(id,tt);const last=tests.filter(t=>t.test===tt).at(-1);const use=b||last;
    const secs=secEntries(use).map(([k,v])=>`${k} ${v}`).join(", ");
    const mocks=tests.filter(t=>t.test===tt&&t.kind!=="Официальный"&&num(t.total)!=null);
    const trend=mocks.length>1?` Пробные: ${mocks.map(m=>fmtScore(tt,num(m.total))).join(" → ")}.`:"";
    const target=(s.targets||{})[tt];

// тип подачи по умолчанию: ближайший ещё не прошедший дедлайн вуза, иначе Regular → Early → Rolling из каталога, иначе Regular
function defaultRound(u,pref){const d=u.deadlines||{};if(pref&&pref!=="auto")return pref;const up=ROUNDS.filter(r=>d[r]&&daysLeft(d[r])>=0).sort((a,b)=>d[a].localeCompare(d[b]))[0];return up||["Regular","Early","Rolling"].find(k=>d[k])||"Regular"}

function pickUnis(studentId){
  const studs=S.students.slice().sort((x,y)=>(x.name||"").localeCompare(y.name||"","ru"));
  let sel=new Set();
  const draw=()=>{
    const sid=val("p-stud")||studentId||"";const q=(val("p-q")||"").toLowerCase();const c=val("p-country");
    const have=new Set(S.rawApps.filter(a=>a.studentId===sid).map(a=>a.uniId));
    const rg=val("p-region");let grp=null;
    const list=S.unis.filter(u=>(!q||(u.name||"").toLowerCase().includes(q))&&(!rg||regionOf(u)===rg)&&(!c||u.country===c)).sort(uniSort);
    $("#p-list").innerHTML=list.length?list.map(u=>{const h=have.has(u.id);const g=regionOf(u);let head="";if(g!==grp){grp=g;head=`<div class="pickhead">${esc(g)}</div>`}return head+`<label class="pick${h?" had":""}"><input type="checkbox" data-uid="${esc(u.id)}"${h||sel.has(u.id)?" checked":""}${h?" disabled":""}><span class="t"><b>${esc(u.name)}</b><span class="sub"> · ${esc(u.country||"")}</span><span class="sub dl">${dlSummary(u)||"дедлайны не указаны"}</span></span>${h?'<span class="chip done">уже есть</span>':""}</label>`}).join("")
      :`<div class="empty">${S.unis.length?"Ничего не найдено.":"Каталог пуст. Добавьте вузы во вкладке «Вузы»."}</div>`;
    $("#p-list").querySelectorAll("input[data-uid]").forEach(cb=>cb.addEventListener("change",()=>{cb.checked?sel.add(cb.dataset.uid):sel.delete(cb.dataset.uid);$("#p-go").textContent=sel.size?`Добавить ${sel.size}`:"Добавить"}));
    $("#p-go").textContent=sel.size?`Добавить ${sel.size}`:"Добавить";
  };
  const countries=[...new Set(S.unis.map(u=>u.country).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ru"));
  openSheet(`<h3>Добавить вузы студенту</h3><div class="grid">
    <label class="full">Студент<select id="p-stud"><option value=""></option>${studs.map(s=>`<option value="${esc(s.id)}"${s.id===studentId?" selected":""}>${esc(s.name)}</option>`).join("")}</select></label>
    <label class="full">Поиск<input id="p-q" placeholder="Название вуза"></label>
    <label>Регион<select id="p-region"><option value="">Все</option>${REGIONS.map(r=>`<option>${r}</option>`).join("")}</select></label>
    <label>Страна<select id="p-country"><option value="">Все</option>${countries.map(c=>`<option>${esc(c)}</option>`).join("")}</select></label>
    <label class="full">Тип подачи для выбранных<select id="p-round"><option value="auto">Авто (ближайший дедлайн из каталога)</option>${ROUNDS.map(r=>`<option>${r}</option>`).join("")}</select></label>
  </div><div class="picklist" id="p-list"></div>
  <div class="actions"><span class="sp"></span><button class="btn" id="cancel">Отмена</button><button class="btn primary" id="p-go">Добавить</button></div>`,()=>{
    draw();

    $("#cancel").onclick=closeSheet;

      const btn=$("#p-go");btn.disabled=true;let n=0;const pref=val("p-round");

        toast(`Добавлено вузов: ${n}`);await reload("apps");closeSheet();studentSheet(sid)}catch(e){fail(e);btn.disabled=false;draw()}

function dlSummary(u){const d=u.deadlines||{};return ROUNDS.filter(r=>d[r]).map(r=>`${r} ${fmtDate(d[r]).slice(0,5)}`).join(" · ")}

function vGrid(){
  const f=S.f;
  const studs=S.students.filter(s=>inSchool(s)&&(!f.gint||(s.intake||"Не определено")===f.gint)&&(!f.gcur||(s.curator||"")===f.gcur));

  const withApps=studs.filter(s=>apps.some(a=>a.studentId===s.id)).sort((a,b)=>(a.name||"").localeCompare(b.name||"","ru"));
  const noApps=studs.length-withApps.length;
  const cols=[...new Set(apps.map(a=>a.uniId))].map(uniOf).filter(Boolean).sort(uniSort);
  const key={};apps.forEach(a=>{key[a.studentId+"|"+a.uniId]=a});
  const short=n=>{n=n.replace(/^University of /,"U of ").replace(/ (University|College)\b/,"").replace(/ \(.*\)$/,"");return n.length>16?n.slice(0,15)+"…":n};
  let grp=null;
  const head=cols.map(u=>{const g=regionOf(u);const first=g!==grp;grp=g;const n=apps.filter(a=>a.uniId===u.id).length;
    return `<th class="gh${first?" gfirst":""}" title="${esc(u.name)} · ${esc(u.country||"")}"><span class="gr">${first?esc(g):"&nbsp;"}</span><span class="gn">${esc(short(u.name))}</span><span class="gc-n">${n}</span></th>`}).join("");

  const table=withApps.length?`<div class="tablebox gridbox"><table class="gtable"><thead><tr><th class="gs gcorner">Студент · док.</th>${head}</tr></thead><tbody>${body}</tbody></table></div>`

  const legend=STATUS.map(st=>`<span class="st ${ST_CLS[st]} leg">${esc(ST_SHORT[st])}</span>`).join("");
  return `<div class="toolbar">
    <select id="f-gint"><option value="">Все сезоны</option>${opts(INTAKES,f.gint,false)}</select>
    <select id="f-gcur"><option value="">Все кураторы</option>${opts(S.lists.curators,f.gcur,false)}</select>
    <select id="f-gregion"><option value="">Все регионы</option>${opts(REGIONS,f.gregion,false)}</select>
    <span class="sub">${withApps.length} студ. × ${cols.length} вузов${noApps?` · без вузов: ${noApps}`:""}</span>
    ${S.canWrite?`<button class="btn" id="add-app"${S.students.length?"":" disabled"} style="margin-left:auto">+ Вузы студенту</button>`:""}</div>
    ${table}

    <p class="note">Нажмите на клетку, чтобы сменить статус. «+» — добавить этот вуз студенту. Имя студента открывает его карточку, дробь — готовые общие документы.</p>`;
}

    `<button data-open="1">Открыть заявку…</button>`;
  document.body.appendChild(m);

  m.querySelector("[data-open]").onclick=()=>{closeMenu();appSheet(id)};
  setTimeout(()=>document.addEventListener("click",outside),0);
}
function outside(e){const m=$("#st-menu");if(m&&!m.contains(e.target))closeMenu()}
function closeMenu(){const m=$("#st-menu");if(m)m.remove();document.removeEventListener("click",outside)}

// студенты меняли вуз после последней проверки куратором
const uniUnreviewed=u=>!!u.lastStudentEditAt&&(!u.studentEditsReviewedAt||Date.parse(u.studentEditsReviewedAt)<Date.parse(u.lastStudentEditAt));
function vUnis(){
  const f=S.f;const q=f.uq.trim().toLowerCase();
  const count=id=>S.rawApps.filter(a=>a.uniId===id).length;
  const budget=num(f.ubudget),ielts=num(f.uielts);
  const nEd=S.unis.filter(uniUnreviewed).length;
  const base=S.unis.filter(u=>(!f.uedits||uniUnreviewed(u))&&(!f.upartner||u.partner)&&(!q||[u.name,u.country,u.city,u.majors,u.reqs,u.entranceExam,u.partner].join(" ").toLowerCase().includes(q))&&(!f.uregion||regionOf(u)===f.uregion)&&(!f.ucountry||u.country===f.ucountry));
  // Бюджет: вуз подходит, если нижняя граница обучения не выше бюджета. IELTS: минимум вуза не выше балла студента. Вузы без данных при включённом фильтре скрываются.
  const rows=base.filter(u=>(budget==null||(u.tuitionUsdMin??u.tuitionUsdMax)!=null&&(u.tuitionUsdMin??u.tuitionUsdMax)<=budget)&&(ielts==null||u.ieltsMin!=null&&Number(u.ieltsMin)<=ielts)).sort(uniSort);
  const hidden=base.length-rows.length;
  let grp=null;

  const body=rows.map(u=>{const n=count(u.id);const d=u.deadlines||{};const next=ROUNDS.map(r=>d[r]).filter(x=>x&&daysLeft(x)>=0).sort()[0];
    const g=regionOf(u);let head="";if(g!==grp){grp=g;head=`<tr class="grp"><td colspan="8">${esc(g)} <span class="sub">· ${rows.filter(x=>regionOf(x)===g).length}</span></td></tr>`}
    const dlt=(u.deadlineText||"").length>70?u.deadlineText.slice(0,70)+"…":u.deadlineText;
    return head+`<tr data-open-uni="${esc(u.id)}"><td><b>${esc(u.name)}</b>${uniUnreviewed(u)?' <span class="chip warn" title="Студенты что-то изменили — откройте вуз, чтобы посмотреть и отметить «Проверено»">'+(u.createdByStudent&&!u.studentEditsReviewedAt?"добавил студент":"правки студентов")+'</span>':""}${u.partner?` <span class="chip acc" title="Партнёр GetGrant: ${esc(u.partner)}">${/^★/.test(u.partner)?"★ партнёр":"партнёр"}</span>`:""}${u.rating?`<div class="sub">${esc(u.rating)}</div>`:""}</td><td>${esc(u.country||"")}</td><td class="num">${esc(tuitionText(u))}${u.fullRide==="Да"?'<div><span class="chip good">есть full-ride</span></div>':""}</td><td class="num">${u.ieltsMin!=null?esc(u.ieltsMin):""}</td><td>${dlSummary(u)?`<span class="sub">${esc(dlSummary(u))}</span>`:dlt?`<span class="sub">${esc(dlt)}</span>`:'<span class="chip warn">нет дедлайнов</span>'}</td><td class="num">${next?fmtDate(next):""}</td><td class="num">${n||""}</td><td class="sub">${esc(u.entranceExam||"")}</td></tr>`}).join("");
  return `<div class="toolbar"><input class="grow" id="f-uq" placeholder="Поиск по каталогу" value="${esc(f.uq)}">
    <select id="f-uregion"><option value="">Все регионы</option>${opts(REGIONS,f.uregion,false)}</select>
    <select id="f-ucountry"><option value="">Все страны</option>${opts(countries,f.ucountry,false)}</select>
    <input id="f-ubudget" type="number" min="0" step="1000" inputmode="numeric" placeholder="Бюджет до $/год" value="${esc(f.ubudget)}" style="width:150px" title="Показать вузы, где обучение в год не дороже этой суммы (USD)">
    <input id="f-uielts" type="number" min="0" max="9" step="0.5" inputmode="decimal" placeholder="IELTS студента" value="${esc(f.uielts)}" style="width:130px" title="Показать вузы, где минимальный IELTS не выше этого балла">
    <button class="btn${f.upartner?" primary":""}" id="f-upartner" type="button" title="Показать только партнёрские вузы GetGrant">Партнёры</button>
    ${nEd||f.uedits?`<button class="btn${f.uedits?" primary":""}" id="f-uedits" type="button" title="Показать только вузы с непроверенными правками студентов">Правки студентов${nEd?" · "+nEd:""}</button>`:""}
    ${S.canWrite?'<button class="btn" id="bulk-uni">Вставить списком</button><button class="btn primary" id="add-uni">+ Вуз</button>':""}</div>
    ${hidden&&(budget!=null||ielts!=null)?`<p class="note" style="margin-top:0">Скрыто ${hidden}: не подходят по бюджету или IELTS, либо в каталоге нет этих данных.</p>`:""}
    <div class="tablebox">${S.unis.length?`<table><thead><tr><th>Вуз</th><th>Страна</th><th class="num">Обучение, $/год</th><th class="num">IELTS</th><th>Дедлайны</th><th class="num">Ближайший</th><th class="num">Студентов</th><th>Экзамен</th></tr></thead><tbody>${body||'<tr><td colspan="8" class="empty">Ничего не найдено.</td></tr>'}</tbody></table>`
    :`<div class="empty"><b>${S.ready.unis?"Каталог вузов пуст":"Загружаю каталог…"}</b>${S.ready.unis?"Вуз с дедлайнами вносится один раз, а потом добавляется студентам галочками. Начните с «Вставить списком».":""}</div>`}</div>
    <p class="note">Дедлайны меняются каждый год — сверяйте их с сайтом вуза в начале сезона.</p>`;

function uniField(u,[c,t,l,,o]){const v=u[camel(c)]??"";const id="ux-"+c;const ph=o&&!Array.isArray(o)?` placeholder="${esc(o)}"`:"";
  if(t==="list")return `<label>${esc(l)}<select id="${id}">${opts(o,v===""?"":String(v))}</select></label>`;
  if(t==="area")return `<label class="full">${esc(l)}<textarea id="${id}" style="min-height:52px"${ph}>${esc(v)}</textarea></label>`;
  const ty=t==="date"?"date":t==="text"?"text":"number";
  return `<label>${esc(l)}<input id="${id}" type="${ty}"${t==="dec"?' step="0.1" min="0"':t==="int"?' step="1" min="0"':""} value="${esc(v)}"${ph}></label>`}
const uniExtraHtml=u=>[...new Set(UNI_EXTRA.map(x=>x[3]))].filter(g=>g!=="main").map(g=>`<div class="sec">${esc(g)}</div>`+UNI_EXTRA.filter(x=>x[3]===g).map(x=>uniField(u,x)).join("")).join("");
const usd=n=>n==null||n===""?"":"$"+Number(n).toLocaleString("ru");
const tuitionText=u=>u.tuitionUsdMin==null&&u.tuitionUsdMax==null?"":!u.tuitionUsdMin&&!u.tuitionUsdMax?"бесплатно":u.tuitionUsdMax!=null&&u.tuitionUsdMax!==u.tuitionUsdMin?`${usd(u.tuitionUsdMin??0)}–${usd(u.tuitionUsdMax).slice(1)}`:usd(u.tuitionUsdMin??u.tuitionUsdMax);
/* --- правки студентов в каталоге (миграция 010): история, «Вернуть», «Проверено» --- */
// подписи полей считаются при вызове: UNI_EXTRA объявлен ниже по файлу
const uniFieldLabel=f=>({name:"Название",country:"Страна",link:"Сайт вуза",deadlines:"Дедлайны","создан вуз":"Вуз добавлен студентом"})[f]||(UNI_EXTRA.find(x=>x[0]===f)||[])[2]||f;
function fmtChange(f,v){if(v==null||v==="")return "—";
  if(f==="deadlines"){try{const d=JSON.parse(v);return ROUNDS.filter(r=>d[r]).map(r=>r+" "+fmtDate(d[r])).join(", ")||"—"}catch(e){return v}}
  const x=UNI_EXTRA.find(e=>e[0]===f);if(x&&x[1]==="date")return fmtDate(v);return v.length>160?v.slice(0,160)+"…":v}
async function loadUniHistory(u){

    <div class="list" style="margin-top:6px">${data.map(c=>`<div class="li" style="cursor:default"><div class="t"><b>${esc(uniFieldLabel(c.field))}</b> <span class="sub">${esc(fmtDate(String(c.created_at||"").slice(0,10)))} · ${esc(c.student_name||"студент")}</span>
      <div class="sub">${esc(fmtChange(c.field,c.old_value))} → ${esc(fmtChange(c.field,c.new_value))}</div></div>
      ${c.reverted_at?'<span class="chip">возвращено</span>':S.canWrite&&c.field!=="создан вуз"?`<button class="btn" type="button" data-revert="${esc(c.id)}">Вернуть</button>`:""}</div>`).join("")}</div>`;
  $("#u-reviewed")&&($("#u-reviewed").onclick=async()=>{try{await S.db.doc("unis/"+u.id).update({studentEditsReviewedAt:new Date().toISOString()});toast("Отмечено как проверенное");await reload("unis");uniSheet(u.id)}catch(e){fail(e)}});
  box.querySelectorAll("[data-revert]").forEach(b=>b.onclick=async()=>{const c=data.find(x=>x.id===b.dataset.revert);if(!c)return;b.disabled=true;
    let v=c.old_value;if(c.field==="deadlines"){try{v=JSON.parse(v||"{}")}catch(e){v={}}}
    try{await S.db.doc("unis/"+u.id).update({[camel(c.field)]:v??"",updatedAt:new Date().toISOString()});
      const r=await SB.from("tracker_uni_changes").update({reverted_at:new Date().toISOString(),reverted_by:S.me}).eq("id",c.id);if(r.error)throw r.error;
      toast("Прежнее значение возвращено");await reload("unis");uniSheet(u.id)}catch(e){fail(e);b.disabled=false}});
}

function bulkUniSheet(){

    const parse=()=>{const have=new Set(S.unis.map(u=>(u.name||"").trim().toLowerCase()));const seen=new Set();
      return val("b-list").split("\n").map(l=>l.split(/\t|;/).map(x=>x.trim())).filter(p=>p[0]).map(([name,country])=>({name,country:country||""})).filter(x=>{const k=x.name.toLowerCase();if(have.has(k)||seen.has(k))return false;seen.add(k);return true})};
    const info=()=>{const n=parse().length;$("#b-info").textContent=n?`Будет добавлено: ${n} (дубликаты пропускаются)`:"";$("#b-go").textContent=n?`Добавить ${n}`:"Добавить"};

  });

/* ---------- «Мои студенты»: фильтр по куратору общий для «Студентов», «Заявок» и «Статусов» и запоминается в этом браузере ---------- */
const CUR_KEYS=["scur","acur","gcur"];
function setMyCurator(v){CUR_KEYS.forEach(k=>S.f[k]=v);try{localStorage.setItem("gg-curator",v)}catch(e){}}
try{const v=localStorage.getItem("gg-curator");if(v)CUR_KEYS.forEach(k=>S.f[k]=v)}catch(e){}
try{const v=localStorage.getItem("gg-school");if(v&&SCHOOLS.includes(v))S.f.school=v}catch(e){}

/* ---------- binding ---------- */
function bindView(){
  const on=(sel,ev,fn)=>{const el=$(sel);el&&el.addEventListener(ev,fn)};
  let t;const deb=(k,v)=>{clearTimeout(t);t=setTimeout(()=>{S.f[k]=v;const pos=document.activeElement&&document.activeElement.id;render();if(pos){const el=document.getElementById(pos);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}},200)};
  on("#f-sq","input",e=>deb("sq",e.target.value));on("#f-uq","input",e=>deb("uq",e.target.value));document.querySelectorAll("#main [data-school]").forEach(b=>b.onclick=()=>{S.f.school=b.dataset.school;try{localStorage.setItem("gg-school",S.f.school)}catch(e){}render()});

  [["#f-gint","gint"],["#f-gcur","gcur"],["#f-gregion","gregion"],["#f-uregion","uregion"],["#f-ucountry","ucountry"],["#f-sint","sint"],["#f-stype","stype"],["#f-strack","strack"],["#f-scur","scur"],["#f-astat","astat"],["#f-acur","acur"]].forEach(([s,k])=>on(s,"change",e=>{if(CUR_KEYS.includes(k))setMyCurator(e.target.value);else S.f[k]=e.target.value;render()}));
  on("#add-student","click",()=>studentSheet());on("#auto-folders","click",()=>autoFoldersSheet());on("#add-app","click",()=>pickUnis());on("#add-uni","click",()=>uniSheet());on("#bulk-uni","click",()=>bulkUniSheet());
  document.querySelectorAll("#main [data-intake]").forEach(el=>el.addEventListener("click",()=>{S.f.sint=el.dataset.intake;S.tab="students";render()}));
