<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GetGrant · мой кабинет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600&display=swap">
<style>
/* Mobile-first student view: header, three tabs, one list per tab. */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#eef2f9; --line:#dbe2ee;
  --fg:#16213a; --muted:#5c6a85; --accent:#1f4fd1; --accent-soft:#e3eafc; --accent-fg:#ffffff;
  --crit:#c2362b; --crit-soft:#fbe4e1; --warn:#9a6700; --warn-soft:#fdf1cf; --good:#1e7b43; --good-soft:#dcf2e4;
  --done:#7a8499; --done-soft:#eceff4;
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --surface:#151d31; --surface-2:#1b2540; --line:#2a3656;
  --fg:#e6ebf7; --muted:#9aa7c4; --accent:#7ea2ff; --accent-soft:#233463; --accent-fg:#0e1424;
  --crit:#ff8a7e; --crit-soft:#4a1f1d; --warn:#f0c14b; --warn-soft:#43361a; --good:#6fd39a; --good-soft:#193a2a;
  --done:#8791a8; --done-soft:#232b40; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:10px;padding-block:14px 4px}
.brand{font-family:var(--display);font-size:16px;margin:0}.brand span{color:var(--accent)}
.who{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.hello{padding-block:6px 2px}.hello h1{font-size:20px;margin:0;text-wrap:balance}.hello .sub{margin-top:2px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:6px}
nav button{font:inherit;font-weight:500;border:0;background:none;color:var(--muted);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav .n{font-size:12px;color:var(--muted);margin-left:4px}
main{padding-top:16px}
.sub{color:var(--muted);font-size:13px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:9px;padding:10px 16px;cursor:pointer}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.55}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.login{max-width:400px;margin:48px auto;padding:24px}.login h2{margin:0 0 6px;font-size:18px}
.login form{display:grid;gap:12px;margin-top:16px}.login label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.msg{padding:10px 12px;border-radius:9px;font-size:14px}.msg.ok{background:var(--good-soft);color:var(--good)}.msg.err{background:var(--crit-soft);color:var(--crit)}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile .v{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}.tile .l{font-size:12px;color:var(--muted)}
.tile.alert .v{color:var(--crit)}
h2.grp{font-size:14px;margin:18px 0 8px;color:var(--accent)}
.uni{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.uni:last-child{border-bottom:0}.uni .nm{font-weight:600}.uni .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.uni select{width:auto;padding:7px 10px;font-size:13.5px;font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.good{background:var(--good-soft);color:var(--good)}.chip.acc{background:var(--accent-soft);color:var(--accent)}.chip.done{background:var(--done-soft);color:var(--done)}
.st-plan{color:var(--muted)}.st-prep{color:var(--warn)}.st-sent{color:var(--accent)}.st-ok{color:var(--good)}.st-no{color:var(--done)}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}.task input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.task .tt{flex:1;min-width:0}.task.done .tt{color:var(--done);text-decoration:line-through}
.period{font-weight:600;font-size:14px;color:var(--accent);margin:18px 0 8px}
.progress{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:6px 0 16px}.progress i{display:block;height:100%;background:var(--good)}
.charts{display:grid;gap:12px;margin-bottom:12px}
.chart{padding:12px 14px}.chart svg{width:100%;height:auto;display:block}
.chart .cg{stroke:var(--line)}.chart .ct{fill:var(--muted);font-size:12px;font-family:var(--body)}.chart .cv{fill:var(--fg);font-weight:600}
.chart .ctarget{stroke:var(--good);stroke-width:1.5;stroke-dasharray:5 4}.chart .cl{fill:none;stroke:var(--accent);stroke-width:2}
.chart .cof{fill:var(--accent);stroke:var(--surface);stroke-width:2}.chart .cmk{fill:var(--surface);stroke:var(--accent);stroke-width:2}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tablebox{overflow-x:auto}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:9px;z-index:30;font-size:14px}
a{color:var(--accent)}
header .wrap{padding-block:0 6px}
/* bottom nav + home */
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{font:inherit;font-size:10px;letter-spacing:-.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:500;border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:3px;padding:4px 0;cursor:pointer}
.bnav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav button[aria-current="page"]{color:var(--accent);font-weight:700}
@media (min-width:820px){.bnav{max-width:760px;margin:0 auto;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}}
.who .em{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hello{display:flex;gap:12px;align-items:center;margin:4px 0 14px}.hello h1{font-size:21px;margin:0}
.av{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;flex:none}
.ttl{font-size:21px;margin:4px 0 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.tiles .tile{font:inherit;text-align:left;cursor:pointer;color:var(--fg);min-width:0}.tiles .tile .v{font-size:21px;line-height:1.2}.tiles .tile .l{font-size:12.5px;margin-top:4px;overflow-wrap:anywhere}
h2.sec{font-size:14px;margin:20px 0 8px;color:var(--fg)}
.empty.small{padding:16px}
.cls{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.cls:last-child{border-bottom:0}.cls .t{flex:1;min-width:0}.cls .tm{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}.r-teal{background:#14a3a3}.r-yellow{background:#e0a800}.r-orange{background:#e46b1f}.r-blue{background:var(--accent)}
.row{font:inherit;color:var(--fg);display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;cursor:pointer}.row:last-child{border-bottom:0}.row .t{flex:1;min-width:0}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:4px;margin-bottom:12px;overflow-x:auto}
.seg button{font:inherit;font-size:13.5px;font-weight:600;flex:1;border:0;background:none;color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.uni{display:block;padding:0;border-bottom:1px solid var(--line)}.ud select{width:100%;font-size:15px}.uni:last-child{border-bottom:0}
.uh{font:inherit;color:var(--fg);width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:13px 14px;cursor:pointer}.uh .t{flex:1;min-width:0}
.chev{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2;flex:none;transition:transform .15s}.uni.open .chev{transform:rotate(180deg)}
.stc{font-size:12px;font-weight:700;white-space:nowrap}
.ud{padding:0 14px 14px}.stsel{display:grid;gap:4px;font-size:12.5px;color:var(--muted);margin-bottom:8px}.stsel select{font-weight:600}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.kv span{color:var(--muted);font-size:12.5px}
.lnk{display:inline-block;margin-top:10px;font-weight:600}
.pw{margin-top:26px;font-size:14px}.pw summary{color:var(--muted);cursor:pointer}.pw form{display:grid;gap:8px;margin-top:10px}
.who a.btn{text-decoration:none;color:var(--fg)}
.tmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}.late{color:var(--crit)}
.tst{font:inherit;font-size:12px;font-weight:700;border:0;border-radius:999px;padding:3px 10px;cursor:pointer}
.ts-0{background:var(--surface-2);color:var(--muted)}.ts-1{background:var(--accent-soft);color:var(--accent)}.ts-2{background:var(--good-soft);color:var(--good)}
.task{align-items:flex-start}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}

textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;min-height:84px;resize:vertical}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ued{display:grid;gap:8px;margin:10px 0 4px}.ued label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}.ued .acts{display:flex;gap:8px;flex-wrap:wrap}
.pickbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:12px}.pickbar select{width:auto;max-width:42vw}
.addbtn{width:100%;margin-bottom:12px}
.chip.in{background:var(--good-soft);color:var(--good)}
.docup{display:grid;gap:10px;padding:14px}.docup label{display:grid;gap:4px;font-size:14px}.docup select,.docup input[type=file]{font:inherit;max-width:100%}
.docrow{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}.docrow:last-child{border-bottom:0}.docrow .t{flex:1;min-width:0;overflow-wrap:anywhere}.docrow .da{display:flex;gap:6px;flex-shrink:0}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="head"><p class="brand">Get<span>Grant</span></p><div class="who" id="who" hidden><span id="who-email" class="em"></span><button class="btn small" id="logout" type="button">Выйти</button></div></div>
</div></header>
<div class="wrap"><main id="main"><div class="empty">Загрузка…</div></main></div>
<nav class="bnav" id="bnav" aria-label="Разделы" hidden></nav>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(() => {
const STATUS=["Планируем","Готовим","Подано","Интервью","Принят","Лист ожидания","Отказ","Отозвано"];
const ROUNDS=["Early","Regular","Rolling"]; // как в index.html и tracker_valid_round() (миграция 009)
const SUBMITTED=new Set(["Подано","Интервью","Принят","Лист ожидания","Отказ","Отозвано"]);
const ST_CLS={"Планируем":"plan","Готовим":"prep","Подано":"sent","Интервью":"sent","Принят":"ok","Лист ожидания":"prep","Отказ":"no","Отозвано":"no"};
const SEC_ORDER=["Listening","Reading","Reading & Writing","Writing","Speaking","Math"];
const TIERS=["High Reach","Reach","Target","Safety","Гос. стипендия"];
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const daysLeft=iso=>{if(!iso)return null;return Math.round((Date.parse(iso+"T00:00:00Z")-Date.parse(todayISO()+"T00:00:00Z"))/864e5)};
const fmtDate=iso=>{if(!iso)return"";const [y,m,d]=String(iso).slice(0,10).split("-");return `${d}.${m}.${y}`};
const num=v=>{const n=parseFloat(String(v??"").replace(",","."));return isFinite(n)?n:null};
const fmtScore=(t,v)=>v==null?"":(t==="IELTS"?Number(v).toFixed(1):String(v));
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
let SB=null,D=null,tab="home";
try{const t=localStorage.getItem("gg-stab");if(["home","schedule","unis","plan","tests","docs"].includes(t))tab=t}catch(e){}

function dueChip(a){if(SUBMITTED.has(a.status))return "";const d=daysLeft(a.deadline);if(d==null)return "";if(d<0)return '<span class="chip done">дедлайн прошёл</span>';
  return `<span class="chip ${d<=7?"crit":d<=21?"warn":""}">${d===0?"сегодня":d+" дн."}</span>`}

const PATTERN_DAYS=p=>{const m={"Вс":0,"Пн":1,"Вт":2,"Ср":3,"Чт":4,"Пт":5,"Сб":6};return String(p||"").split(/[^А-Яа-я]+/).map(x=>m[x]).filter(x=>x!=null)};
const ROOM_CLS=r=>({"Бирюзовый":"r-teal","Жёлтый":"r-yellow","Желтый":"r-yellow","Оранжевый":"r-orange","Синий":"r-blue"}[r]||"r-blue");
const DOW=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const initials=n=>String(n||"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const TASK_ST=["Не начато","В процессе","Готово"];
const taskSt=t=>t.status||(t.done?"Готово":"Не начато");
const ICONS={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',schedule:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',unis:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',plan:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',tests:'<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',docs:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>'};
const TABS=[["home","Главная"],["schedule","Расписание"],["unis","Вузы"],["plan","План"],["tests","Тесты"],["docs","Документы"]];

function render(){
  document.querySelectorAll("#bnav button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  // не теряем набранный, но ещё не сохранённый текст (заметки, программа), если страница перерисовалась — например, после возврата в приложение
  const keep={};document.querySelectorAll("#main textarea[id],#main input[id^='ed-prog-']").forEach(e=>keep[e.id]=e.value);
  $("#main").innerHTML=({home:vHome,schedule:vSchedule,unis:vUnis,plan:vTasks,tests:vTests,docs:vDocs}[tab]||vHome)();
  for(const id in keep){const el=document.getElementById(id);if(el)el.value=keep[id]}
  bind();window.scrollTo(0,0);if(tab==="docs")loadDocs();
}
function todayClasses(){const dow=new Date().getDay();return (D.classes||[]).filter(c=>PATTERN_DAYS(c.pattern).includes(dow)).sort((a,b)=>String(a.start).localeCompare(String(b.start)))}
function classRow(c){return `<div class="cls"><span class="dot ${ROOM_CLS(c.room)}"></span><div class="t"><b>${esc(c.subject)}</b><div class="sub">${esc([c.teacher,c.room&&("кабинет: "+c.room)].filter(Boolean).join(" · "))}</div></div><div class="tm">${esc(c.start||"")}–${esc(c.end||"")}</div></div>`}
function vHome(){
  const s=D.student||{};const first=String(s.name||"").split(/\s+/)[0]||"";
  const tc=todayClasses();const now=nowHM();const next=tc.find(c=>String(c.end)>=now);
  const openApps=D.apps.filter(a=>!SUBMITTED.has(a.status)&&daysLeft(a.deadline)!=null&&daysLeft(a.deadline)>=0).sort((a,b)=>a.deadline.localeCompare(b.deadline));
  const nd=openApps[0];
  const tasks=D.tasks;const done=tasks.filter(t=>taskSt(t)==="Готово").length;
  const week=tasks.filter(t=>taskSt(t)!=="Готово"&&t.due&&daysLeft(t.due)<=7).sort((a,b)=>a.due.localeCompare(b.due));
  const inprog=tasks.filter(t=>taskSt(t)==="В процессе");
  const targets=s.targets||{};const tg=Object.entries(targets).map(([k,v])=>{const best=D.tests.filter(t=>t.test===k&&num(t.total)!=null).map(t=>num(t.total));const cur=best.length?Math.max(...best):null;return {k,v:num(v),cur}}).filter(x=>x.v!=null);
  const g=tg.find(x=>x.cur==null||x.cur<x.v)||tg[0];
  const tiles=[
    next?[next.start,`${next.subject}${next.teacher?" · "+next.teacher:""}`,"schedule"]:[tc.length?"—":"—",tc.length?"Занятия на сегодня закончились":"Сегодня занятий нет","schedule"],
    nd?[`${daysLeft(nd.deadline)} дн.`,`до дедлайна · ${nd.uni}`,"unis",daysLeft(nd.deadline)<=7]:["—","ближайших дедлайнов нет","unis"],
    [`${done}/${tasks.length}`,"задач выполнено","plan"],
    g?[g.cur==null?`цель ${fmtScore(g.k,g.v)}`:`${fmtScore(g.k,g.cur)} → ${fmtScore(g.k,g.v)}`,g.cur!=null&&g.cur>=g.v?`${g.k}: цель достигнута`:`${g.k}: лучший результат → цель`,"tests"]:[String(D.apps.length),"вузов в списке","unis"]
  ];
  return `<section class="hello"><div class="av" aria-hidden="true">${esc(initials(s.name))}</div><div><h1>Здравствуйте, ${esc(first)}</h1><div class="sub">Сегодня ${DOW[new Date().getDay()]}, ${fmtDate(todayISO())}</div></div></section>
  <div class="tiles">${tiles.map(([v,l,go,al])=>`<button class="tile${al?" alert":""}" data-go="${go}"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></button>`).join("")}</div>
  <h2 class="sec">Сегодня</h2>${tc.length?`<div class="card">${tc.map(classRow).join("")}</div>`:'<div class="card empty small">Сегодня занятий нет.</div>'}
  ${week.length||inprog.length?`<h2 class="sec">Задачи на неделю</h2><div class="card">${[...week,...inprog.filter(t=>!week.includes(t))].slice(0,6).map(taskRow).join("")}</div>`:""}

}
function taskRow(t){const st=taskSt(t),d=daysLeft(t.due),late=st!=="Готово"&&d!=null&&d<0;
  return `<div class="task${st==="Готово"?" done":""}"><input type="checkbox" data-task="${esc(t.id)}"${st==="Готово"?" checked":""} aria-label="Готово"><div class="tt">${esc(t.title).replace(/\n/g,"<br>")}
  <div class="tmeta">${t.due?`<span class="sub${late?" late":""}">до ${fmtDate(t.due)}</span>`:""}<button class="tst ts-${TASK_ST.indexOf(st)}" data-tst="${esc(t.id)}" title="Нажмите, чтобы сменить статус">${st}</button></div></div></div>`}
function vTasks(){
  const ts=D.tasks;if(!ts.length)return '<h1 class="ttl">Мой план</h1><div class="card empty">Задач пока нет.</div>';
  const done=ts.filter(t=>taskSt(t)==="Готово").length;const prep=ts.filter(t=>t.kind!=="timeline"),tl=ts.filter(t=>t.kind==="timeline");
  const periods=[];tl.forEach(t=>{const p=t.period||"Без периода";if(!periods.includes(p))periods.push(p)});
  return `<h1 class="ttl">Мой план</h1><div class="sub">Выполнено ${done} из ${ts.length}</div><div class="progress"><i style="width:${Math.round(done/ts.length*100)}%"></i></div>
  ${prep.length?`<h2 class="sec">Что нужно сделать до подачи</h2><div class="card">${prep.map(taskRow).join("")}</div>`:""}
  ${periods.map(p=>`<h2 class="sec">${esc(p)}</h2><div class="card">${tl.filter(t=>(t.period||"Без периода")===p).map(taskRow).join("")}</div>`).join("")}
  <p class="sub" style="margin-top:14px">Нажмите на статус задачи, чтобы отметить «В процессе».</p>`;
}
async function setTask(id,st){const {error}=await SB.rpc("student_set_task_status",{task_id:id,new_status:st});
  if(error){const r=await SB.rpc("student_set_task_done",{task_id:id,is_done:st==="Готово"});if(r.error){toast("Не сохранилось. Попробуйте ещё раз");await load();return}}
  const t=D.tasks.find(x=>x.id===id);if(t){t.status=st;t.done=st==="Готово"}render()}
function bind(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  if(tab==="unis")bindMine();
  document.querySelectorAll("[data-pat]").forEach(b=>b.onclick=()=>{schedPat=b.dataset.pat;render()});
  document.querySelectorAll("[data-uni]").forEach(b=>b.onclick=()=>{openUni=openUni===b.dataset.uni?null:b.dataset.uni;const y=window.scrollY;render();window.scrollTo(0,y)});
  document.querySelectorAll("[data-app]").forEach(sel=>sel.onchange=async()=>{sel.disabled=true;const {error}=await SB.rpc("student_set_app_status",{app_id:sel.dataset.app,new_status:sel.value});
    if(error){toast("Не сохранилось. Попробуйте ещё раз");await load();return}const a=D.apps.find(x=>x.id===sel.dataset.app);if(a)a.status=sel.value;toast("Статус сохранён");const y=window.scrollY;render();window.scrollTo(0,y)});
  document.querySelectorAll("[data-task]").forEach(cb=>cb.onchange=()=>{cb.disabled=true;const y=window.scrollY;setTask(cb.dataset.task,cb.checked?"Готово":"Не начато").then(()=>window.scrollTo(0,y))});
  document.querySelectorAll("[data-tst]").forEach(b=>b.onclick=()=>{const t=D.tasks.find(x=>x.id===b.dataset.tst);if(!t)return;const nx=TASK_ST[(TASK_ST.indexOf(taskSt(t))+1)%3];b.disabled=true;const y=window.scrollY;setTask(t.id,nx).then(()=>window.scrollTo(0,y))});
}
document.addEventListener("submit",async e=>{if(e.target.id!=="pw-form")return;e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;const {error}=await SB.auth.updateUser({password:$("#pw-new").value});b.disabled=false;if(error){toast(/weak|short|length/i.test(error.message)?"Пароль слишком простой — минимум 8 символов":"Не получилось сохранить пароль");return}e.target.reset();toast("Пароль сохранён")});

/* --- документы: файлы лежат на Google Диске центра, доступ только через функцию drive --- */
const DOC_TYPES_S=["Паспорт","Аттестат / транскрипт","Сертификат IELTS/SAT","Эссе","Согласие родителей","Портфолио","Финансовые документы","Другое"];
const fmtSize=b=>b==null?"":b<1048576?Math.max(1,Math.round(b/1024))+" КБ":(b/1048576).toFixed(1).replace(".",",")+" МБ";
async function driveCall(body,raw){
  const cfg=window.TRACKER_CONFIG||{};const {data:{session}}=await SB.auth.getSession();const isF=body instanceof FormData;
  let r;try{r=await fetch(String(cfg.SUPABASE_URL).replace(/\/+$/,"")+"/functions/v1/drive",{method:"POST",headers:{Authorization:"Bearer "+((session&&session.access_token)||""),apikey:cfg.SUPABASE_ANON_KEY,...(isF?{}:{"Content-Type":"application/json"})},body:isF?body:JSON.stringify(body)})}
  catch(e){throw new Error("Нет связи. Проверьте интернет.")}
  if(raw&&r.ok)return r;const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(r.status===404&&!d.error?"Раздел документов ещё не подключён. Сообщите куратору.":(d.error||"Ошибка "+r.status));return d}
function vDocs(){return `<h1 class="ttl">Мои документы</h1><div class="sub" style="margin:-6px 0 12px">Загрузите сканы или фото — куратор увидит их сразу</div>
  <form class="card docup" id="doc-form"><label>Что это за документ<select id="doc-cat">${DOC_TYPES_S.map(t=>`<option>${esc(t)}</option>`).join("")}</select></label>
  <label>Файл (PDF, фото, Word — до 25 МБ)<input type="file" id="doc-file" multiple accept="image/*,application/pdf,.doc,.docx,.heic"></label>
  <button class="btn primary" type="submit">Загрузить</button></form><div id="doc-list"><div class="card empty small">Загружаю…</div></div>`}
async function loadDocs(){
  const box=$("#doc-list");if(!box)return;let d;
  try{d=await driveCall({action:"list"})}catch(e){box.innerHTML=`<div class="card empty small">${esc(e.message)}</div>`;return}
  if(tab!=="docs"||!$("#doc-list"))return;
  const groups={};d.files.forEach(f=>{const c=f.category||"Документы от куратора";(groups[c]=groups[c]||[]).push(f)});
  box.innerHTML=d.files.length?Object.entries(groups).map(([c,fs])=>`<h2 class="sec">${esc(c)}</h2><div class="card">${fs.map(f=>`<div class="docrow"><div class="t"><b>${esc(f.name)}</b><div class="sub">${esc([fmtDate((f.modifiedTime||"").slice(0,10)),fmtSize(f.size),f.byStudent?"вы загрузили":"от куратора"].filter(Boolean).join(" · "))}</div></div><div class="da"><button class="btn small" data-ddl="${esc(f.id)}">Скачать</button>${f.byStudent?`<button class="btn small" data-ddel="${esc(f.id)}">Удалить</button>`:""}</div></div>`).join("")}</div>`).join(""):'<div class="card empty small">Документов пока нет.</div>';
  box.querySelectorAll("[data-ddl]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await driveCall({action:"download",fileId:b.dataset.ddl},true);const name=decodeURIComponent(r.headers.get("x-file-name")||"файл");const url=URL.createObjectURL(await r.blob());const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){toast(e.message)}b.disabled=false});
  box.querySelectorAll("[data-ddel]").forEach(b=>b.onclick=async()=>{if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Точно?";setTimeout(()=>{delete b.dataset.armed;b.textContent="Удалить"},4000);return}
    b.disabled=true;try{await driveCall({action:"delete",fileId:b.dataset.ddel});toast("Файл удалён");loadDocs()}catch(e){toast(e.message);b.disabled=false}});
}
document.addEventListener("submit",async e=>{if(e.target.id!=="doc-form")return;e.preventDefault();const fl=[...$("#doc-file").files];if(!fl.length){toast("Выберите файл");return}
  const big=fl.find(f=>f.size>25*1024*1024);if(big){toast("«"+big.name+"» больше 25 МБ");return}
  const b=e.target.querySelector("button");b.disabled=true;let n=0;
  for(const f of fl){b.textContent="Загружаю "+(n+1)+"/"+fl.length+"…";const fd=new FormData();fd.append("action","upload");fd.append("category",$("#doc-cat").value);fd.append("file",f,f.name);try{await driveCall(fd);n++}catch(err){toast(f.name+": "+err.message)}}
  b.disabled=false;b.textContent="Загрузить";if(n){toast("Загружено: "+n);e.target.reset()}loadDocs()});
function go(t){tab=t;picking=false;editCat=null;try{localStorage.setItem("gg-stab",tab)}catch(e){}render()}

function chart(test,all,target){
  all=all.filter(t=>t.date&&num(t.total)!=null);if(!all.length)return "";
  const vals=all.map(t=>num(t.total)).concat(target!=null?[target]:[]);let lo=Math.min(...vals),hi=Math.max(...vals);const pad=Math.max((hi-lo)*.15,test==="IELTS"?0.5:test==="SAT"?20:2);lo-=pad;hi+=pad;
  const W=360,H=170,L=36,R=26,T=14,B=24,t0=Date.parse(all[0].date),t1=Date.parse(all.at(-1).date);
  const X=d=>all.length===1?L+(W-L-R)/2:L+(Date.parse(d)-t0)/(t1-t0||1)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const ticks=[lo+pad,(lo+hi)/2,hi-pad].map(v=>test==="IELTS"?Math.round(v*2)/2:Math.round(v));
  return `<div class="card chart"><div><b>${esc(test)}</b>${target!=null?` <span class="sub">· цель ${fmtScore(test,target)}</span>`:""}</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Прогресс ${esc(test)}">
  ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" class="cg"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" class="ct">${fmtScore(test,v)}</text>`).join("")}
  ${target!=null?`<line x1="${L}" x2="${W-R}" y1="${Y(target)}" y2="${Y(target)}" class="ctarget"/>`:""}
  <path class="cl" d="${all.map((t,i)=>`${i?"L":"M"}${X(t.date).toFixed(1)} ${Y(num(t.total)).toFixed(1)}`).join("")}"/>
  ${all.map(t=>`<circle cx="${X(t.date)}" cy="${Y(num(t.total))}" r="5" class="${t.kind==="Официальный"?"cof":"cmk"}"><title>${fmtDate(t.date)} · ${fmtScore(test,num(t.total))}</title></circle>`).join("")}
  <text x="${X(all.at(-1).date)}" y="${Y(num(all.at(-1).total))-10}" text-anchor="${all.length>1?"end":"middle"}" class="ct cv">${fmtScore(test,num(all.at(-1).total))}</text>
  <text x="${X(all[0].date)}" y="${H-7}" text-anchor="middle" class="ct">${fmtDate(all[0].date).slice(0,5)}</text>${all.length>1?`<text x="${X(all.at(-1).date)}" y="${H-7}" text-anchor="end" class="ct">${fmtDate(all.at(-1).date).slice(0,5)}</text>`:""}
  </svg><div class="sub">● официальный · ○ пробный</div></div>`;
}
function vTests(){return '<h1 class="ttl">Тесты</h1>'+vTestsBody()}
function vTestsBody(){
  const ts=D.tests;const targets=(D.student&&D.student.targets)||{};
  if(!ts.length)return '<div class="card empty">Результатов тестов пока нет.</div>';
  const types=[...new Set(ts.map(t=>t.test))];
  const charts=types.map(t=>chart(t,ts.filter(x=>x.test===t),num(targets[t]))).join("");
  const rows=ts.slice().reverse().map(t=>`<tr><td>${fmtDate(t.date)||"—"}</td><td>${esc(t.test)}</td><td class="num"><b>${esc(fmtScore(t.test,num(t.total))||t.total||"")}</b></td><td>${t.kind==="Официальный"?'<span class="chip good">офиц.</span>':'<span class="chip">пробный</span>'}</td><td class="sub">${esc(Object.entries(t.sections||{}).filter(([k,v])=>v!==""&&v!=null).sort((a,b)=>SEC_ORDER.indexOf(a[0])-SEC_ORDER.indexOf(b[0])).map(([k,v])=>k.split(" ")[0]+" "+v).join(" · "))}</td></tr>`).join("");
  return `${Object.keys(targets).length?`<p class="sub">Цели: ${Object.entries(targets).map(([k,v])=>`${esc(k)} ${esc(v)}`).join(" · ")}</p>`:""}
  ${charts?`<div class="charts">${charts}</div>`:""}
  <div class="card tablebox"><table><thead><tr><th>Дата</th><th>Тест</th><th class="num">Итог</th><th>Тип</th><th>Секции</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function loginScreen(note){
  $("#bnav").hidden=true;
  $("#main").innerHTML=`<div class="card login"><h2>Вход в личный кабинет</h2><p class="sub">Введите email, который вы дали куратору. Мы пришлём письмо со ссылкой для входа — пароль не нужен.</p>
  ${note?`<p class="msg err">${note}</p>`:""}
  <form id="f-link"><label>Email<input id="l-email" type="email" autocomplete="email" required></label><button class="btn primary" type="submit">Получить ссылку для входа</button></form>
  <div id="l-sent" hidden><p class="msg ok">Письмо отправлено. Откройте его на этом устройстве и нажмите на ссылку. Если письма нет — проверьте «Спам».</p></div>
  <p class="sub" style="margin-top:16px"><a href="#" id="l-pass-toggle">Войти с паролем</a></p>
  <form id="f-pass" hidden><label>Email<input id="p-email" type="email" autocomplete="username" required></label><label>Пароль<input id="p-pass" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">Войти</button></form></div>`;
  $("#f-link").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;
    const {error}=await SB.auth.signInWithOtp({email:$("#l-email").value.trim().toLowerCase(),options:{emailRedirectTo:location.href.split("#")[0].split("?")[0]}});
    b.disabled=false;if(error){toast(/rate|limit|seconds/i.test(error.message)?"Слишком много писем — подождите немного и попробуйте снова":"Не получилось отправить письмо: "+error.message);return}$("#l-sent").hidden=false};
  $("#l-pass-toggle").onclick=e=>{e.preventDefault();$("#f-pass").hidden=!$("#f-pass").hidden};
  $("#f-pass").onsubmit=async e=>{e.preventDefault();const {error}=await SB.auth.signInWithPassword({email:$("#p-email").value.trim().toLowerCase(),password:$("#p-pass").value});if(error)toast("Неверный email или пароль")};
}
async function load(){
  const {data,error}=await SB.rpc("student_portal");
  if(error){$("#main").innerHTML='<div class="card empty">Кабинет ещё не настроен. Сообщите куратору.</div>';console.error(error);return}
  if(!data){const st=await SB.from("tracker_staff").select("email").limit(1);if(st.data&&st.data.length){location.replace("./");return}
    loginScreen("Этот email не привязан ни к одному студенту. Напишите куратору, чтобы он добавил ваш email в карточку.");$("#who").hidden=false;return}
  D=data;D.apps=D.apps||[];D.tasks=D.tasks||[];D.tests=D.tests||[];
  D.classes=D.classes||[];
  try{const st=await SB.from("tracker_staff").select("email").limit(1);if(st.data&&st.data.length&&!$("#to-staff"))$("#who").insertAdjacentHTML("afterbegin",'<a id="to-staff" class="btn small" href="./">Трекер</a>')}catch(e){}
  const nav=$("#bnav");nav.innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg><span>${l}</span></button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.tab));nav.hidden=false;render();
}
let started=false;
async function start(session){
  if(!session){started=false;$("#who").hidden=true;loginScreen();return}
  $("#who").hidden=false;$("#who-email").textContent=session.user.email;
  if(started)return;started=true;await load();
}
(async()=>{
  const cfg=window.TRACKER_CONFIG||{};
  if(!window.supabase||!cfg.SUPABASE_URL||/YOUR-/.test(cfg.SUPABASE_URL)){$("#main").innerHTML='<div class="card empty">Кабинет ещё не подключён к базе.</div>';return}
  SB=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  $("#logout").onclick=async()=>{await SB.auth.signOut();location.href=location.href.split("#")[0]};
  SB.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_IN"&&!started)start(s);if(ev==="SIGNED_OUT")start(null)});
  const {data:{session}}=await SB.auth.getSession();await start(session);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&started)load()});
})();
})();
</script>
